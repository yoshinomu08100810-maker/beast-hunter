:root{--ink:#0a0d10;--plate:#252c34;--plate2:#171c22;--bone:#e9e2cf;--bone2:#8c8474;--paper:#252c34;--paper2:#2f3841;--night:#0e1216;--gold:#e0b34e;--blue:#4c8ec7;--red:#c05744;--green:#7ab35c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--night);color:var(--bone);font-family:'DotG',"DotGothic16","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none}
.panel{pointer-events:auto;position:absolute;left:10px;right:10px;background:linear-gradient(180deg,var(--plate),var(--plate2));border:2px solid var(--ink);box-shadow:inset 0 0 0 2px #6b6152,0 6px 18px rgba(0,0,0,.6);padding:14px 13px;color:var(--bone);touch-action:pan-y;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.panel.center{top:0;bottom:0;margin:auto 0;height:-webkit-fit-content;height:fit-content;max-height:88vh;transform:none}
.panel.sheet{bottom:118px;max-height:62vh}
.panel.sheet.one{bottom:20px;max-height:70vh}
h1,h2{margin:0 0 8px;font-weight:700}
h1{font-size:21px;color:var(--gold)}h2{font-size:17px;color:var(--gold);border-bottom:2px solid #6b6152;padding-bottom:5px}
p{margin:6px 0;line-height:1.5;font-size:14px}
small{font-size:12px}
button{font:inherit;font-size:15px;background:linear-gradient(180deg,#39424d,#232a32);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px #6b6152;padding:10px 12px;color:var(--bone);margin:4px 2px;border-radius:0}
button:active{transform:translateY(1px);filter:brightness(1.25)}
button.pri{background:linear-gradient(180deg,#f0c96a,#b98a2c);color:#1b1408;text-shadow:none}
button.small{font-size:13px;padding:6px 10px}
button.on{background:linear-gradient(180deg,#f0c96a,#b98a2c);color:#1b1408}
button:disabled{opacity:.45}
input[type=text]{font:inherit;font-size:16px;padding:9px;border:2px solid var(--ink);box-shadow:inset 0 0 0 1px #6b6152;background:#12171c;color:var(--bone);width:100%;user-select:text;-webkit-user-select:text;margin-bottom:6px}
.row{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.stat{display:grid;grid-template-columns:4.4em 1fr auto;align-items:center;gap:6px;margin:4px 0}
.bar{height:10px;background:#12171c;border:2px solid #6b6152;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue)}
.job{border:2px solid #6b6152;padding:8px;margin:8px 0;background:rgba(224,179,78,.10)}
.job b{font-size:18px}
.item{border:1px solid #444d57;border-left:4px solid var(--gold);padding:8px;margin:6px 0;background:rgba(255,255,255,.045);display:flex;justify-content:space-between;align-items:center;gap:8px}
.item.lock{border-left-color:#555;opacity:.6}
.splash,.titlescr,.opening{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;text-align:center}
.logo b{display:block;font-size:30px;letter-spacing:2px;color:#ffe08a;text-shadow:3px 3px 0 #3a1a10,0 0 12px rgba(255,200,100,.35)}
.logo small{display:block;color:var(--bone);margin-top:4px;text-shadow:2px 2px 0 #000}
.logo.big b{font-size:34px}
.splash .tap{margin-top:36vh;color:#fff;text-shadow:2px 2px 0 #000;animation:bt 1s infinite alternate}
.splash .ld{margin-top:8px;color:var(--bone2);font-size:11px}
.titlescr .logo{margin-top:-20vh}
.tbtns{margin-top:30vh;display:flex;flex-direction:column;gap:8px;min-width:200px}
.tbtns button{margin:0;padding:12px;font-size:16px}
.langbtn{position:absolute;right:8px;top:calc(8px + env(safe-area-inset-top,0px))}
.langbtn button{margin:0;padding:5px 10px;font-size:12px}
.tlinks{position:absolute;bottom:34px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:0 10px}
.updbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top,0px));z-index:50;background:rgba(10,13,16,.95);border:2px solid var(--gold);color:var(--bone);padding:6px 10px;font-size:13px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.updbar button{margin:0;padding:4px 10px;font-size:12px}
.iosguide{position:absolute;inset:0;background:rgba(0,0,0,.55);pointer-events:auto;z-index:40}
.tlinks button{margin:0;padding:5px 10px;font-size:12px}
.xcode{width:100%;min-height:70px;margin:6px 0;padding:6px;font-size:11px;font-family:monospace;background:#0f1418;color:var(--bone);border:2px solid #6b6152;word-break:break-all;resize:vertical}
.ofl{white-space:pre-wrap;font-size:10px;line-height:1.4;max-height:40vh;overflow:auto;background:#0f1418;padding:6px;border:1px solid #444d57;font-family:monospace}
.edroll{position:absolute;inset:0;pointer-events:auto}
.edclip{position:absolute;left:0;right:0;top:0;bottom:30%;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 85%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 12%,#000 85%,transparent 100%)}
.edlines{position:absolute;left:0;right:0;top:100%;text-align:center;color:var(--bone);text-shadow:0 1px 0 #000,0 0 4px #000}
.edl{font-size:15px;line-height:1.9}
.edl.h{color:var(--gold);font-size:13px;margin-top:4px}
.edl.s{font-size:11px;color:var(--bone2)}
.edl.big{font-size:26px;color:#ffe7a0;letter-spacing:1px}
.edl.big2{font-size:22px;color:#fff}
.edhint{position:absolute;left:10px;top:calc(18px + env(safe-area-inset-top,0px));font-size:11px;color:var(--bone2)}
.edend{position:absolute;inset:0;pointer-events:auto;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
.edcont{font-size:20px;color:#ffe7a0;animation:fadein 2s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.adslot{display:flex;flex-direction:column;align-items:center;margin:10px auto 0;opacity:.95}
.adslot small{font-size:9px;color:var(--bone2);align-self:center;margin-bottom:2px}
.adfr{border:0;display:block;max-width:100%;background:transparent}
.adtest{display:flex;align-items:center;justify-content:center;max-width:100%;background:repeating-linear-gradient(45deg,#2a2f36,#2a2f36 6px,#232830 6px,#232830 12px);border:1px dashed #6b6152;color:var(--bone2);font-size:11px}
.titlescr .adslot{position:absolute;left:0;right:0;bottom:84px}
.adhelp{border-left-color:#7fc8f5!important}
.adov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center}
.adbox{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--bone);padding:20px;border:2px solid #6b6152;background:#1a1e24}
.adbox b{font-size:40px;color:#ffd35a}
.legal{text-align:left}
.legal p small{line-height:1.6}
.titlescr .ver{position:absolute;bottom:10px;color:var(--bone2)}
.opening{justify-content:flex-end;padding-bottom:22vh}
.optext{color:#fff;font-size:17px;text-shadow:2px 2px 0 #000;padding:0 20px;animation:ft .8s ease-out}
@keyframes ft{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.opskip{position:absolute;right:10px;top:10px;margin:0;padding:6px 12px;font-size:12px}
.opdots{margin-top:16px;display:flex;gap:6px}
.opdots i{width:6px;height:6px;background:#555;display:block}
.opdots i.on{background:#ffe08a}
.intro{position:absolute;inset:0;pointer-events:auto;background:rgba(6,8,10,.55);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#ipic{width:min(84vw,360px);height:auto;image-rendering:pixelated;margin-bottom:8px;background:rgba(18,23,28,.85);border:2px solid #6b6152}
.ibox{width:calc(100% - 20px);max-width:420px;background:rgba(10,13,16,.94);border:2px solid #e0b34e;padding:10px 12px 8px;color:var(--bone)}
.ihead{display:flex;align-items:center;gap:6px;margin-bottom:4px}
#iface{width:38px;height:30px;image-rendering:pixelated;background:#1e2a22;border:1px solid #6b6152}
.iname{color:var(--gold);font-size:13px}
.itext{font-size:16px;line-height:1.6;min-height:52px}
.itext b{color:#fff}
.inext{margin-top:6px;font-size:11px;color:var(--bone2);display:flex;justify-content:space-between;animation:bt 1s infinite alternate}
.iskip{position:absolute;right:10px;top:10px;margin:0;padding:6px 12px;font-size:12px}
.tour{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.gear{position:absolute;right:8px;top:8px;width:40px;height:40px;margin:0;padding:0;font-size:22px;line-height:36px;text-align:center;pointer-events:auto;background:rgba(10,13,16,.72);border:2px solid #6b6152;color:var(--bone);z-index:5}
.hud .hrtag{pointer-events:auto;cursor:pointer;font-weight:bold}
.item.eqrow{cursor:pointer}
.item.eqon{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;background:rgba(224,179,78,.10)}
.tag.eqtag{color:#1a1206;background:var(--gold);border-color:var(--gold)}
.hrbar{height:8px;background:#0f1418;border:1px solid #444d57;margin:6px 0 2px}
.hrbar i{display:block;height:100%;background:linear-gradient(90deg,#c08050,#e0b34e)}
.item.q.promo{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;background:rgba(224,179,78,.08)}
.job.hrup{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;animation:ppop .5s ease-out}
.hud .jobtag{pointer-events:auto;cursor:pointer;border-color:currentColor}
.hud .tag[onpointerdown]{pointer-events:auto;cursor:pointer}
.hud .vlv{pointer-events:auto;cursor:pointer;color:var(--gold);border-color:#e0b34e;background:rgba(10,13,16,.75);margin-left:6px}
.guide{position:absolute;left:40%;right:8px;bottom:calc(64px + env(safe-area-inset-bottom,0px));top:auto;background:rgba(10,13,16,.9);border:2px solid #7fc8f5;padding:7px 8px;color:var(--bone);font-size:13px;line-height:1.5;pointer-events:auto}
.guide.gtop{top:74px;bottom:auto}
#sb.padglow{border-color:#ffd35a;animation:padg .8s infinite alternate}
@keyframes padg{from{box-shadow:0 0 0 2px rgba(10,13,16,.45),0 0 6px 2px rgba(255,211,90,.5)}to{box-shadow:0 0 0 2px rgba(10,13,16,.45),0 0 18px 7px rgba(255,211,90,.9)}}
#sb .finger{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:rgba(255,242,160,.9);box-shadow:0 0 0 3px rgba(255,211,90,.6);animation:fing 1.6s infinite ease-in-out;pointer-events:none}
@keyframes fing{0%{transform:translate(0,0);opacity:0}15%{opacity:1}45%{transform:translate(0,-26px)}70%{transform:translate(24px,0)}90%{opacity:1}100%{transform:translate(0,0);opacity:0}}
.guide .gh{color:#7fc8f5;font-size:11px;margin-bottom:2px}
.guide b{color:#fff}
.guide button{position:absolute;right:4px;top:4px;margin:0;padding:1px 6px;font-size:11px;line-height:1.4}
.guide small{display:block;margin-top:2px}
.fpond{position:relative;height:34px;margin:4px auto 2px;width:120px;background:radial-gradient(#3f86c8,#2f6fb0);border:2px solid #6b6152}
.fpond i{position:absolute;left:50%;top:50%;width:6px;height:4px;margin:-2px -3px;border:1px solid rgba(255,255,255,.75);border-radius:50%;opacity:0;animation:rp 2.4s infinite}
.fpond i:nth-child(2){animation-delay:.8s}
.fpond i:nth-child(3){animation-delay:1.6s}
@keyframes rp{0%{transform:scale(.4);opacity:.85}100%{transform:scale(7);opacity:0}}
.pri.bite{animation:bt .4s infinite alternate}
@keyframes bt{from{filter:brightness(1)}to{filter:brightness(1.35)}}
.fbar{position:relative;height:22px;margin:10px 0;border:2px solid #6b6152;background:#12171c}
.fbar .z{position:absolute;left:62%;width:26%;top:0;bottom:0;background:rgba(159,224,122,.55)}
.fbar span{position:absolute;top:-2px;bottom:-2px;width:4px;background:#ffd35a;box-shadow:0 0 0 1px #000}
.qty{align-items:center;gap:4px;margin:4px 0;flex-wrap:wrap}
.qty small{color:var(--bone2)}
.qty button{margin:0;padding:6px 8px;min-width:38px}
.preset.sel{border-color:var(--jc);color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.2)),var(--plate);box-shadow:0 0 0 2px var(--jc),0 0 10px 2px var(--jc)}
.preset.pop{animation:ppop .45s ease-out}
@keyframes ppop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.curjob{margin:6px 0 2px}
.curjob b{font-size:16px;margin-left:2px}
.look{display:flex;gap:10px;align-items:center;margin:6px 0 2px}
.lookpv{width:63px;height:75px;image-rendering:pixelated;background:#4f9a3c;border:2px solid #6b6152;flex:none}
.lookopts{flex:1;min-width:0}
.lrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:2px 0}
.lrow small{width:30px;color:var(--bone2)}
.lrow button.small{margin:0;padding:5px 7px;font-size:12px}
.sw{width:26px;height:26px;margin:0;padding:0;border:2px solid #0a0d10;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.sw.on{box-shadow:0 0 0 2px var(--gold),inset 0 0 0 1px rgba(255,255,255,.4)}
.nmcand{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}

function monSt(k,sec){const m=B.m;if(!m||m.hp<=0)return;if(!m.ail)m.ail={};if(!m.res)m.res={};
 const r=m.res[k]||0;sec=sec*Math.pow(0.6,r);m.res[k]=r+1;
 m.ail[k]=Math.max(m.ail[k]||0,sec);flash(m.def.name+'が'+MST[k].name+'になった！'+(r?'（効きが弱い）':''),MST[k].col);sfx('crit');
 B.fx.push({t:'burst',x:EX(),y:GY()-10,tt:0,dur:0.35,col:MST[k].col,r:16});}
function monFlashBomb(){const m=B.m;if(!m||m.hp<=0)return;const r=(m.res&&m.res.flash)||0;if(!m.res)m.res={};m.res.flash=r+1;
 B.fx.push({t:'burst',x:EX(),y:GY()-14,tt:0,dur:0.4,col:'#ffffff',r:30});
 if(r>=2){flash('もう閃光に慣れている','#8c8474');return;}

function cropCount(k){return k==='herb'?S.p.herb:(S.p.crops&&S.p.crops[k])||0;}
function needName(k){return CROPS[k]?CROPS[k].name:MATS[k];}
function haveNeed(k){return CROPS[k]?cropCount(k):(S.p.mats[k]||0);}
function payNeed(k,n){if(k==='herb')S.p.herb-=n;else if(CROPS[k])S.p.crops[k]-=n;else S.p.mats[k]-=n;}
function canBrew(r){return Object.keys(r.need).every(k=>haveNeed(k)>=r.need[k]);}
function brewRecipe(i){const r=RECIPES[i];let n=0;
 while(n<QTY&&canBrew(r)){for(const k in r.need)payNeed(k,r.need[k]);S.p.items[r.out]=(S.p.items[r.out]||0)+r.n;n++;}
 if(!n)return;sfx('buy');save();toast(ITEMS[r.out].name+'を'+n+'個つくった');rerender();}
function brewHTML(){const P=S.p;return`<div class="panel sheet one"><h2>調合小屋</h2><p><small>畑の作物と素材から薬や投げ道具を作る</small></p>
 <div class="job"><small>薬草 ${P.herb}　毒消草 ${cropCount('anti')}　活力草 ${cropCount('vital')}</small></div>${qtyBar()}
 ${RECIPES.map((r,i)=>{const it=ITEMS[r.out];const ok=canBrew(r);return`<div class="item"><div><b>${it.name}</b>${r.n>1?'×'+r.n:''}<br><small>${it.desc}</small><br><small>材料 ${Object.keys(r.need).map(k=>needName(k)+'×'+r.need[k]+'（所持'+haveNeed(k)+'）').join('　')}</small></div><button class="small pri" ${ok?'':'disabled'} onclick="brewRecipe(${i})">つくる${QTY>1?'<br><small>最大×'+QTY+'</small>':''}</button></div>`;}).join('')}
 <button onclick="closePanel()">閉じる</button></div>`;}
function cureSt(p,k){if(!p.st)p.st={};if(k)p.st[k]=0;else{for(const x in p.st)p.st[x]=0;}}
function hasSt(p,k){return !!(p.st&&p.st[k]>0);}
function giveSt(p,k,sec){if(!p.st)p.st={};if(p.d.res&&p.d.res[k])sec*=1-p.d.res[k];if(sec<=0)return;
 if((p.st[k]||0)<=0&&p===B.p){flash(ST[k].name+'になった！','#ff9a8a');sfx('hurt');tutSay('ail','状態異常だ。右下の道具で治せる。村のポーチに解毒薬などを入れておこう','#a0ff5a');}p.st[k]=Math.max(p.st[k]||0,sec);}

function lighten(hex,k){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.round(r+(255-r)*k);g=Math.round(g+(255-g)*k);b=Math.round(b+(255-b)*k);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function rawSprite(rows,pal){const w=rows[0].length,h=rows.length;const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=rows[y][x];if(ch==='.')continue;const col=pal[ch];if(!col)continue;g.fillStyle=col;g.fillRect(x,y,1,1);}return c;}
function outlineRows(g,layers,col){const rows=layers[0],h=rows.length,w=rows[0].length;
 const solid=(x,y)=>{if(x<0||y<0||x>=w||y>=h)return false;for(let i=0;i<layers.length;i++){const r=layers[i][y];if(r&&r[x]&&r[x]!=='.')return true;}return false;};
 g.fillStyle=col;
 for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){if(solid(x,y))continue;if(solid(x-1,y)||solid(x+1,y)||solid(x,y-1)||solid(x,y+1))g.fillRect(x+1,y+1,1,1);}}
function composite(layers,pals,col){const h=layers[0].length,w=layers[0][0].length;
 const c=document.createElement('canvas');c.width=w+2;c.height=h+2;const g=c.getContext('2d');
 outlineRows(g,layers,col);
 for(let i=0;i<layers.length;i++)g.drawImage(rawSprite(layers[i],pals[i]),1,1);
 return c;}
function sprite(rows,pal,key){if(sprCache.has(key))return sprCache.get(key);const c=rawSprite(rows,pal);sprCache.set(key,c);return c;}

const OUTW=OUTLINE;
function px(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h);}
// (x,y) は握りの位置
function drawWeaponArt(g,id,x,y){const a=W_ART[id];if(!a)return;
 if(a.t==='sword'){
  const bl=a.len,w=a.w;
  // 刃
  for(let i=0;i<bl;i++){
   const yy=y-2-i;let off=0,ww=w;
   if(a.style==='bone')off=Math.round(Math.sin(i/bl*1.6)*1.4);
   if(a.style==='broad'&&i<bl-3)ww=w;
   if(a.style==='scale'&&i<bl-4)ww=w;
   if(i>bl-3)ww=Math.max(1,w-1);
   px(g,x+off,yy,ww,1,OUTW);
   px(g,x+off,yy,ww-1,1,a.col);
   px(g,x+off+ww-1,yy,1,1,a.edge);
   if(a.style==='serrated'&&i%2===0)px(g,x+off+ww,yy,1,1,a.edge);
   if(a.style==='broad'&&i%3===1)px(g,x+off+Math.floor(ww/2),yy,1,1,a.edge);
   if(a.style==='scale'&&i%2===0)px(g,x+off+1,yy,1,1,a.edge);
  }
  if(a.style==='twin'){for(let i=0;i<bl-2;i++){px(g,x+3,y-1-i,1,1,OUTW);px(g,x+3,y-1-i,1,1,a.col);}}
  // 鍔と柄
  px(g,x-2,y-1,w+4,1,OUTW);px(g,x-2,y,w+4,1,a.grip);
  px(g,x,y+1,w,3,a.pom);px(g,x,y+4,w,1,OUTW);
  if(a.style==='scale'){px(g,x-3,y-1,1,1,a.grip);px(g,x+w+2,y-1,1,1,a.grip);}
  if(a.style==='broad'){px(g,x-3,y-1,1,2,a.grip);px(g,x+w+2,y-1,1,2,a.grip);}
 }else if(a.t==='bow'){
  const r=a.r;g.lineWidth=1;
  g.strokeStyle=OUTW;g.beginPath();g.arc(x-1,y-2,r+1,-1.25,1.25);g.stroke();
  g.strokeStyle=a.col;g.beginPath();g.arc(x-1,y-2,r,-1.25,1.25);g.stroke();
  g.strokeStyle=a.str;g.beginPath();g.moveTo(x,y-2-r+1);g.lineTo(x,y-2+r-1);g.stroke();
  if(a.style==='bone'){px(g,x-2,y-2-r,2,2,a.orn);px(g,x-2,y-2+r-1,2,2,a.orn);}
  if(a.style==='feather'){for(let i=0;i<3;i++){px(g,x-3-i,y-2-r+1+i,1,1,a.orn);px(g,x-3-i,y-2+r-2-i,1,1,a.orn);}}
  if(a.style==='heavy'){px(g,x-1,y-4,3,5,a.orn);px(g,x-1,y-4,1,5,OUTW);}
  if(a.style==='ornate'){px(g,x-2,y-2-r,2,1,a.orn);px(g,x-2,y-1+r-2,2,1,a.orn);px(g,x+1,y-3,1,3,a.orn);}
  if(a.style==='dragon'){px(g,x-3,y-2-r,3,2,a.orn);px(g,x-3,y-2+r-2,3,2,a.orn);px(g,x-1,y-5,2,2,a.orn);}
  px(g,x-1,y-3,2,3,a.col);
 }else{
  const L=a.len;
  px(g,x,y-L+4,2,L,OUTW);px(g,x,y-L+4,1,L,a.col);
  const hx=x-1,hy=y-L+1;
  if(a.style==='orb'){g.fillStyle=OUTW;g.beginPath();g.arc(hx+1,hy,3.2,0,Math.PI*2);g.fill();g.fillStyle=a.head;g.beginPath();g.arc(hx+1,hy,2.4,0,Math.PI*2);g.fill();px(g,hx,hy-1,1,1,a.glow);}
  else if(a.style==='bone'){px(g,hx-1,hy-2,4,4,OUTW);px(g,hx,hy-1,3,3,a.head);px(g,hx,hy,1,1,OUTW);px(g,hx+2,hy,1,1,OUTW);}
  else if(a.style==='feather'){for(let i=0;i<4;i++){px(g,hx+1-i,hy-3+i,1,2,a.head);px(g,hx+2+i,hy-3+i,1,2,a.glow);}px(g,hx+1,hy,1,2,a.col);}
  else if(a.style==='spike'){px(g,hx-1,hy-1,4,3,OUTW);px(g,hx,hy-1,3,2,a.head);px(g,hx+1,hy-4,1,3,a.glow);px(g,hx-2,hy,1,1,a.glow);px(g,hx+3,hy,1,1,a.glow);}
  else if(a.style==='gem'){px(g,hx-1,hy-3,4,5,OUTW);px(g,hx,hy-2,3,4,a.head);px(g,hx+1,hy-1,1,1,a.glow);px(g,hx-2,hy-1,1,2,a.col);px(g,hx+3,hy-1,1,2,a.col);}
  else {px(g,hx-2,hy-3,6,5,OUTW);px(g,hx-1,hy-2,4,3,a.head);px(g,hx,hy-1,1,1,a.glow);px(g,hx+2,hy-4,1,2,a.col);px(g,hx-1,hy-4,1,2,a.col);px(g,hx-2,hy+1,1,2,a.col);}
 }}

 const set=(y,x,ch,onlyEmpty)=>{if(y<0||y>=g.length||x<0||x>=W0)return;if(onlyEmpty&&g[y][x]!=='.')return;g[y][x]=ch;};
 const round=()=>{for(let x=0;x<W0;x++)g[0][x]='.';for(let x=0;x<W0;x++)g[1][x]=(x>=5&&x<=13)?'h':'.';};
 if(style==='short'){round();}
 if(style==='long'){round();
  for(let y=6;y<=14;y++){[2,3,15,16].forEach(x=>set(y,x,'h',true));}
  for(let y=12;y<=13;y++){[4,5,13,14].forEach(x=>set(y,x,'h',true));}
  for(let y=7;y<=10;y++){set(y,3,'H');set(y,15,'H');}
  [2,16].forEach(x=>set(15,x,'h',true));}
 if(style==='bob'){round();
  for(let y=6;y<=11;y++){[2,3,15,16].forEach(x=>set(y,x,'h',true));}
  for(let y=7;y<=10;y++){set(y,3,'H');set(y,15,'H');}
  [4,5,6,12,13,14].forEach(x=>set(6,x,'H'));}
 if(style==='pony'){round();
  set(3,16,'H');set(3,17,'W');set(4,17,'H');set(4,18,'h',true);
  for(let y=4;y<=12;y++){set(y,17,'h',true);set(y,18,'h',true);if(y>=5&&y<=10)set(y,17,'H');}
  set(13,17,'h',true);}
 if(sex==='f'){
  set(7,5,'e');set(7,13,'e');set(8,4,'e');set(8,14,'e');   // まつ毛（外側に跳ねる）
  set(11,5,'r');set(11,13,'r');                            // 頬の赤み
  set(17,5,'t');set(17,13,'t');                            // 腰を少し細く
  for(let x=5;x<=13;x++)set(18,x,'T');                     // スカート
  for(let x=3;x<=15;x++)set(19,x,(x%2)?'T':'t');           // 裾が広がり、ひだが入る
  set(20,3,'.');set(20,15,'.');}
 const out=g.map(r=>r.join(''));BODY_CACHE[k]=out;return out;}
const ARMOR_F_CACHE={};
function armorFor(aid,sex){const base=(aid&&ARMOR_ART[aid])?ARMOR_ART[aid]:EMPTY22;if(sex!=='f'||!aid||!ARMOR_ART[aid])return base;
 if(ARMOR_F_CACHE[aid])return ARMOR_F_CACHE[aid];
 const g=base.map(r=>r.split(''));const W0=g[0].length;
 for(let x=5;x<=13;x++)g[18][x]='1';          // 防具の色でスカート
 for(let x=3;x<=15;x++)g[19][x]=(x%2)?'1':'2';// 裾が広がり、ひだが入る
 g[18][9]='3';                                 // 前の飾り
 const out=g.map(r=>r.join(''));ARMOR_F_CACHE[aid]=out;return out;}
const RIBBON=(function(){const r=[];for(let i=0;i<23;i++)r.push('...................');const put=(y,x,c)=>{r[y]=r[y].slice(0,x)+c+r[y].slice(x+1);};
 put(3,16,'1');put(3,17,'1');put(4,16,'2');put(4,17,'1');put(4,18,'1');put(5,16,'1');put(5,17,'1');return r;})();

 const arm=armorFor(armor,L.sex);
 let armPal=(armor&&ARM_PALS[armor])?ARM_PALS[armor]:{};
 const dye=(L.dye&&DYES[L.dye])?L.dye:'none';if(dye!=='none'&&armor)armPal=dyePal(armPal,dye);
 const jg=JOB_GEAR[job]||JOB_GEAR[JOB_GEAR_ALIAS[job]]||JOB_GEAR.bouken;
 const HC=HAIR_COLORS[L.color];
 const layers=[bodyFor(L.hair,f,L.sex),arm,jg],pals=[Object.assign({},PAL_P,{h:HC.h,H:HC.H,W:HC.W},{t:j.dark,T:j.color}),armPal,{1:j.color,2:j.dark,3:'#f2eee2',4:'#b9c2cc',5:'#6d7884'}];

 const o=composite(layers,pals,OUTLINE);
 sprCache.set(key,o);return o;}

function pairFit(s,a,b){const tot=STAT_KEYS.reduce((x,k)=>x+s[k],0);if(tot<=0)return false;
 const sa=s[a],sb=s[b],sum=sa+sb;
 return sum>=tot*0.52&&Math.abs(sa-sb)<=sum*0.25&&sa>=tot*0.2&&sb>=tot*0.2;}
function computeJob(s){const tot=STAT_KEYS.reduce((a,k)=>a+s[k],0);const mx=Math.max(...STAT_KEYS.map(k=>s[k]));const isMax=k=>s[k]===mx;
 const mm0=s.mag+s.mnd;
 if(mm0>=tot*0.5&&Math.abs(s.mag-s.mnd)<=mm0*0.25)return'kenja';
 for(const h of HYBRIDS){const P=JOBS[h].pair;if(pairFit(s,P[0],P[1]))return h;}
 if(isMax('str')&&s.str>=tot*0.35)return'kenshi';if(isMax('dex')&&s.dex>=s.str*1.3)return'karyudo';if(isMax('vit')&&s.vit>=s.str*1.2)return'shugo';
 const mm=s.mag+s.mnd;if(mm>=tot*0.5&&Math.abs(s.mag-s.mnd)<=mm*0.25)return'kenja';if(isMax('mag')&&s.mag>=s.mnd*1.4)return'madou';if(isMax('mnd')&&s.mnd>=s.mag*1.4)return'iyashi';return'bouken';}
function gearBonus(p){const b={atk:0,atkD:0,atkM:0,heal:0,hp:0,def:0,cd:0};['w','a','c'].forEach(sl=>{const id=p.eq[sl],g=GEAR[id];if(!g)return;const lv=(p.upg&&p.upg[id])||0;for(const k in b){if(k==='cd'){b.cd+=g.cd||0;continue;}const v=g[k]||0;const ex=Math.max(0,lv-5);b[k]+=v+(v?Math.round(v*(0.15*Math.min(lv,5)+0.25*ex)):0);}});return b;}
function derived(p){const s=p.stats,g=gearBonus(p);const job=computeJob(s);const adv=computeAdv(p);const defp=(job==='shugo'?25:0)+(adv==='daijun'?8:0)+g.def;const r=runeSum(p);return{job,hp:40+s.vit*6+g.hp,atk:4+s.str*1.3+s.dex*0.5+g.atk,atkD:4+s.dex*1.3+s.str*0.4+g.atkD,atkM:4+s.mag*1.3+s.mnd*0.5+g.atkM,heal:(10+s.mnd*1.5+g.heal)*(adv==='daikenja'?1.2:1),cdMul:clamp(1-Math.min(s.dex,40)*0.01+(g.cd||0)-(adv==='boukenou'?0.08:0),0.55,1.4),teleMul:1+Math.min(s.mnd,40)*0.02,def:(1-defp/100)*(1-r.def),r,adv,jobName:jobInfo(p).name,res:(GEAR[p.eq.c]&&GEAR[p.eq.c].res)||{},throwMul:(GEAR[p.eq.c]&&GEAR[p.eq.c].throwMul)||1,partMul:(GEAR[p.eq.c]&&GEAR[p.eq.c].partMul)||1,cid:p.eq.c||null,wtype:GEAR[p.eq.w]?GEAR[p.eq.w].type:null,wid:p.eq.w||null,aid:p.eq.a||null,look:normLook(p.look)};}
function power(p){const g=gearBonus(p);return STAT_KEYS.reduce((a,k)=>a+p.stats[k],0)+p.lv*3+Math.round(g.atk+g.atkD+g.atkM+g.hp/5+g.def/2-(g.cd||0)*120);}
function mark(p,q){const pw=power(p);return pw>=q.req?'◎':pw>=q.req*0.75?'○':'△';}

function gainExp(p,e){p.exp+=e;const ups=[];while(p.exp>=needExp(p.lv)){p.exp-=needExp(p.lv);p.lv++;p.pts+=PTS_PER_LV;ups.push(p.lv);}return ups;}
function allocAuto(p,w){const pts=p.pts;if(pts<=0)return;const tw=STAT_KEYS.reduce((a,k)=>a+(w[k]||0),0);if(!tw)return;const exact={},add={};let used=0;STAT_KEYS.forEach(k=>{exact[k]=pts*(w[k]||0)/tw;add[k]=Math.floor(exact[k]);used+=add[k];});const rem=STAT_KEYS.slice().sort((a,b)=>(exact[b]-add[b])-(exact[a]-add[a]));for(let i=0;used<pts;i++){add[rem[i%5]]++;used++;}STAT_KEYS.forEach(k=>p.stats[k]+=add[k]);p.pts=0;}

 keys.forEach(k=>{const a=g[k]||0;const bv=cur?((cur[k]||0)+(cur[k]?Math.round(cur[k]*(0.15*Math.min(lv,5)+0.25*Math.max(0,lv-5))):0)):0;

function npcRec(id){if(!S.npc)S.npc={};if(!S.npc[id])S.npc[id]={step:0,done:false};return S.npc[id];}
function npcAsk(n){const r=npcRec(n.id);return r.step<n.asks.length?n.asks[r.step]:null;}
function askOk(a){const P=S.p;
 if(a.need.herb&&P.herb<a.need.herb)return false;
 if(a.need.items)for(const k in a.need.items)if((P.items[k]||0)<a.need.items[k])return false;
 if(a.need.mats)for(const k in a.need.mats)if((P.mats[k]||0)<a.need.mats[k])return false;
 if(a.need.clear&&qrec(a.need.clear.q).n<a.need.clear.n)return false;
 return true;}
function askText(a){const o=[];
 if(a.need.herb)o.push('薬草×'+a.need.herb);
 if(a.need.items)for(const k in a.need.items)o.push(ITEMS[k].name+'×'+a.need.items[k]);
 if(a.need.mats)for(const k in a.need.mats)o.push(MATS[k]+'×'+a.need.mats[k]);
 if(a.need.clear){const q=QUESTS.find(x=>x.id===a.need.clear.q);o.push('「'+(q?q.name:'?')+'」の討伐');}
 return o.join('・');}
function rewardText(g){const o=[];if(g.gold)o.push(g.gold+'G');
 if(g.items)for(const k in g.items)o.push(ITEMS[k].name+'×'+g.items[k]);
 if(g.mats)for(const k in g.mats)o.push(MATS[k]+'×'+g.mats[k]);
 return o.join('・');}
function npcGive(id){const n=NPCS.find(x=>x.id===id);const r=npcRec(id);const a=npcAsk(n);if(!a||!askOk(a))return;
 const P=S.p;
 if(a.need.herb)P.herb-=a.need.herb;
 if(a.need.items)for(const k in a.need.items)P.items[k]-=a.need.items[k];
 if(a.need.mats)for(const k in a.need.mats)P.mats[k]-=a.need.mats[k];
 const g=a.give;if(g.gold)P.gold+=g.gold;
 if(g.items)for(const k in g.items)P.items[k]=(P.items[k]||0)+g.items[k];
 if(g.mats)for(const k in g.mats){P.mats[k]=(P.mats[k]||0)+g.mats[k];seeMat(k,g.mats[k]);}
 r.step++;if(r.step>=n.asks.length)r.done=true;
 save();sfx('buy');toast(a.thanks+'（'+rewardText(g)+'）');rerender();}
function npcSay(n){const a=npcAsk(n);if(!a)return'「いつも助かっているよ」';
 return'「'+a.say+'」';}
function npcActs(n){const a=npcAsk(n);const out=a?[{l:'渡す（'+askText(a)+'）',f:()=>npcGive(n.id),dis:!askOk(a)}]:[];
 if(n.id==='hunter')out.push({l:'村を案内してもらう',f:()=>tourStart(TOUR_VILLAGE)});
 return out;}
function npcBadge(){return NPCS.filter(n=>{const a=npcAsk(n);return a&&askOk(a);}).length;}

function fishPick(){const mw=f=>f.w*((timeBand()==='morning'&&f.rare)?3:1);const tot=FISH.reduce((a,f)=>a+mw(f),0);let r=Math.random()*tot;

let FS=null;   // 釣りの状態
function openFish(){FS={phase:'wait',t:0,wait:0.8+Math.random()*2.2,fish:null,res:null,bar:0,dir:1};openPanel('fish');fishPaint();fishLoop();}
function closeFish(){FS=null;closePanel();}
function fishLoop(){if(!FS||panel!=='fish')return;
 const dt=1/30;FS.t+=dt;
 if(FS.phase==='wait'&&FS.t>=FS.wait){FS.phase='bite';FS.t=0;FS.fish=fishPick();try{sfx('warn');}catch(e){}}
 else if(FS.phase==='bite'&&FS.t>0.9){FS.phase='miss';FS.res='見送ってしまった';FS.t=0;try{sfx('lose');}catch(e){}}
 else if(FS.phase==='hook'){FS.bar+=FS.dir*dt*1.6;if(FS.bar>1){FS.bar=1;FS.dir=-1;}if(FS.bar<0){FS.bar=0;FS.dir=1;}}
 fishPaint();
 FS.timer=setTimeout(fishLoop,33);}
function fishPaint(){const F=FS;if(!F)return;
 const msg=$('#fmsg'),wrap=$('#fbarwrap'),mk=$('#fmk'),btn=$('#fbtn'),rec=$('#frec');
 if(!msg||!btn)return;
 const dots='・'.repeat(1+Math.floor(F.t*2)%3);
 const html=F.phase==='wait'?'<span style="color:#9fd8f5">水面を見ている'+dots+'</span><br><small>魚が食いついたら「引く！」が出ます</small>'
  :F.phase==='bite'?'<b style="color:var(--gold);font-size:20px">！ 引いている</b><br><small>今すぐ押す</small>'
  :F.phase==='hook'?'<small>緑の帯で止める</small>'
  :F.phase==='catch'?'<b style="color:'+F.res.col+'">'+F.res.name+'</b> を釣った！<br><small>'+F.res.gold+'G'+(F.res.junk?'':'・経験値'+F.res.exp)+(F.res.rare?'・獣の心珠×1':'')+'</small>'
  :'<small>'+(typeof F.res==='string'?F.res:'逃げられた')+'</small>';
 if(msg.dataset.h!==html){msg.dataset.h=html;msg.innerHTML=html;}
 if(wrap)wrap.style.display=F.phase==='hook'?'block':'none';
 if(mk&&F.phase==='hook')mk.style.left=Math.round(F.bar*100)+'%';
 if(F.phase==='wait'){btn.style.visibility='hidden';}
 else{btn.style.visibility='visible';const lab=F.phase==='hook'?'止める':F.phase==='bite'?'引く！':'もう一度';
  if(btn.textContent!==lab)btn.textContent=lab;
  btn.className=(F.phase==='bite'||F.phase==='hook')?'pri bite':'pri';}
 if(rec){const r=fishRec();const t='釣った数 '+r.n+'　種類 '+Object.keys(r.kinds).length+'/'+FISH.length;if(rec.textContent!==t)rec.textContent=t;}}
function fishTap(){if(!FS)return;fishTapInner();fishPaint();}
function fishTapInner(){if(!FS)return;
 if(FS.phase==='wait')return;   // 待機中は押す操作がない
 if(FS.phase==='bite'){FS.phase='hook';FS.t=0;FS.bar=0;FS.dir=1;try{sfx('ui');}catch(e){}return;}
 if(FS.phase==='hook'){const good=FS.bar>0.62&&FS.bar<0.88;
  if(good){const f=FS.fish;FS.phase='catch';FS.res=f;
   const P=S.p;P.gold+=f.gold;const r=fishRec();r.n++;r.kinds[f.id]=(r.kinds[f.id]||0)+1;
   if(!f.junk){const ups=gainExp(P,f.exp);if(ups.length)toast('レベルアップ！ Lv'+ups[ups.length-1]);}
   if(f.rare)P.mats.shin=(P.mats.shin||0)+1;
   save();try{sfx(f.rare?'crit':'win');}catch(e){}}
  else{FS.phase='miss';FS.res='逃げられた';try{sfx('lose');}catch(e){}}
  return;}
 if(FS.phase==='miss'||FS.phase==='catch'){FS.phase='wait';FS.t=0;FS.wait=0.8+Math.random()*2.2;FS.fish=null;FS.res=null;}}
function fishHTML(){if(!FS)return'';
 return`<div class="panel sheet one" style="text-align:center"><h2>釣り</h2>
 <div class="fpond" id="fpond"><i></i><i></i><i></i></div>
 <p id="fmsg" style="font-size:16px;min-height:42px"></p>

 <button class="pri" id="fbtn" onclick="fishTap()" style="font-size:17px;padding:14px 26px">待つ</button>
 <p><small id="frec"></small></p>
 <button onclick="closeFish()">やめる</button></div>`;}
function boardBadge(){const T=todayRec();return Math.max(0,3-T.done.length);}
function gearKnown(id){const g=GEAR[id];if(!g.craft)return true;return Object.keys(g.craft).every(k=>matSeen(k));}
function gearName(id){if(!GEAR[id])return'';const lv=(S&&S.p.upg&&S.p.upg[id])||0;return GEAR[id].name+(lv?' +'+lv:'');}
function gearDesc(g,lv){if(g.slot==='c')return g.desc||'';if(lv){const ex=Math.max(0,lv-5);const o={};for(const k in g)if(typeof g[k]==='number'&&['atk','atkD','atkM','heal','hp','def'].includes(k))o[k]=g[k]+Math.round(g[k]*(0.15*Math.min(lv,5)+0.25*ex));g=Object.assign({},g,o);}
const o=[];if(g.atk)o.push('攻撃+'+g.atk);if(g.atkD)o.push('弓+'+g.atkD);if(g.atkM)o.push('魔法+'+g.atkM);if(g.heal)o.push('回復+'+g.heal);if(g.hp)o.push('HP+'+g.hp);if(g.def)o.push('防御+'+g.def+'%');if(g.cd)o.push('待ち時間'+(g.cd<0?'':'+')+Math.round(g.cd*100)+'%');return o.join(' ');}

function farmQuestBoost(){let any=false;S.farm.plots.forEach(pl=>{if(pl.planted&&pl.stage<3){pl.stage=3;any=true;}});return any;}
function plant(i,crop){const P=S.p;crop=crop||'herb';const sd=CROPS[crop].seed;if((P.items[sd]||0)<=0){toast('種がない。村の道具屋で買える');return;}const pl=S.farm.plots[i];P.items[sd]--;pl.planted=true;pl.stage=1;pl.crop=crop;save();toast(CROPS[crop].name+'の種をまいた。クエストを1つクリアすると実る');}
function harvest(i){const pl=S.farm.plots[i];if(!pl.planted||pl.stage<3)return;const crop=pl.crop||'herb';if(!S.p.crops)S.p.crops={anti:0,vital:0};
 if(crop==='herb'){S.p.herb+=2;S.p.items.seed+=2;}else{S.p.crops[crop]=(S.p.crops[crop]||0)+2;S.p.items[CROPS[crop].seed]=(S.p.items[CROPS[crop].seed]||0)+1;}
 pl.planted=false;pl.stage=0;save();toast(CROPS[crop].name+'2つを収穫'+(crop==='herb'?'（種2つも）':'（種1つも）'));}
function brew(){if(S.p.herb<2)return;S.p.herb-=2;S.p.items.potion++;save();toast('回復薬をつくった');rerender();}
function expand(){if(S.p.mats.tusk<3||S.farm.plots.length>=maxPlots())return;S.p.mats.tusk-=3;S.farm.plots.push({planted:false,stage:0});save();toast('畑が広がった');}
function allocated(){return STAT_KEYS.reduce((a,k)=>a+S.p.stats[k]-BASE,0);}
function resetLeft(){return RESET_LIMIT?Math.max(0,RESET_LIMIT-S.p.resets):Infinity;}
function askSpring(){openPanel('springAsk');}
function doSpring(){const P=S.p;if(P.herb<1){toast('薬草が1つ必要');return;}if(resetLeft()<=0){toast('もう振り直せない');return;}const alloc=allocated();if(alloc<=0)return;P.herb--;P.resets++;STAT_KEYS.forEach(k=>P.stats[k]=BASE);P.pts+=alloc;P.auto=null;save();openPanel('sprung');}

const QTY_MAX=99;
function setQty(n){n=parseInt(n,10);if(isNaN(n))n=1;QTY=Math.max(1,Math.min(QTY_MAX,n));rerender();}
function qtyBar(){return`<div class="row qty"><small>個数</small>
 <button class="small" onclick="setQty(QTY-10)">−10</button>
 <button class="small" onclick="setQty(QTY-1)">−1</button>

 <button class="small" onclick="setQty(QTY+1)">＋1</button>

function buyItem(id){const it=ITEMS[id];if((it.lv||1)>villageLv())return;const pr=Math.round(it.price*priceMul());
 let n=0;while(n<QTY&&S.p.gold>=pr){S.p.gold-=pr;S.p.items[id]=(S.p.items[id]||0)+1;n++;}
 if(!n){toast('ゴールドが足りない');return;}
 save();sfx('buy');toast(it.name+'を'+n+'個買った');rerender();}
function buyGear(id){const g=GEAR[id];if((g.lv||1)>villageLv())return;const pr=Math.round(g.price*priceMul());if(S.p.gear.includes(id)){toast('もう持っている');return;}if(S.p.gold<pr){toast('ゴールドが足りない');return;}S.p.gold-=pr;S.p.gear.push(id);sfx('buy');const eqd=!S.p.eq[g.slot];if(eqd)S.p.eq[g.slot]=id;save();toast(g.name+'を買った'+(eqd?'（装備した）':''));rerender();}
function craftGear(id){const g=GEAR[id];if(S.p.gear.includes(id)){toast('もう持っている');return;}for(const k in g.craft)if((S.p.mats[k]||0)<g.craft[k]){toast(MATS[k]+'が足りない');return;}if(S.p.gold<g.gold){toast('ゴールドが足りない');return;}for(const k in g.craft)S.p.mats[k]-=g.craft[k];S.p.gold-=g.gold;S.p.gear.push(id);S.p.eq[g.slot]=id;sfx('buy');save();toast(g.name+'をつくった（装備した）');rerender();}
function upgMaxNow(){return UPG_HARD+(typeof hrUpgBonus==='function'?hrUpgBonus():0);}
function upgradeGear(id){const P=S.p,lv=P.upg[id]||0;if(lv>=upgMaxNow())return;const c=upgCost(lv);
 for(const k of ['tusk','hide','shin','rin'])if(c[k]&&(P.mats[k]||0)<c[k]){toast('材料が足りない（'+MATS[k]+'）');return;}
 if(P.gold<c.gold){toast('ゴールドが足りない');return;}
 P.gold-=c.gold;for(const k of ['tusk','hide','shin','rin'])if(c[k])P.mats[k]-=c[k];
 P.upg[id]=lv+1;sfx('buy');save();toast(GEAR[id].name+' が +'+(lv+1)+' になった');rerender();}
function equip(slot,id){S.p.eq[slot]=id||null;save();rerender();}

let UIKEY='';
function setUI(h){h=tr(h);const key=(typeof scene!=='undefined'?scene:'')+':'+(typeof panel!=='undefined'&&panel?panel:'');
 const old=ui.querySelector('.panel');const sc=old?old.scrollTop:0;const same=(key===UIKEY);
 ui.innerHTML=h;UIKEY=key;
 const nw=ui.querySelector('.panel');if(nw&&sc&&same)nw.scrollTop=sc;}
function toast(t){const el=$('#toast');if(!el)return;el.textContent=tr(t);el.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>{el.style.opacity=0;},1600);}
function rerender(){if(scene==='create')renderCreate();else if(scene==='world')renderWorld();}
function adj(k,d){if(!T)return;if(d>0){if(T.pts<=0)return;T.stats[k]++;T.pts--;}else{if(T.stats[k]<=T._floor[k])return;T.stats[k]--;T.pts++;}T.auto=null;rerender();}
function pickPreset(id){if(!T)return;const pr=PRESETS.find(x=>x.id===id);STAT_KEYS.forEach(k=>{T.pts+=T.stats[k]-T._floor[k];T.stats[k]=T._floor[k];});allocAuto(T,pr.w);T.auto=pr.w;rerender();}
function statRows(o,ed){return STAT_KEYS.map(k=>{const v=o.stats[k];const dn=ed&&v>o._floor[k],up=ed&&o.pts>0;return`<div class="stat"><span><b>${STAT_NAME[k]}</b><br><small style="font-size:10px">${STAT_HINT[k]}</small></span><div class="bar"><i style="width:${Math.min(100,v/40*100)}%"></i></div><span class="row">${ed?`<button class="small" ${dn?'':'disabled'} onclick="adj('${k}',-1)">−</button>`:''}<b style="min-width:2em;text-align:center">${v}</b>${ed?`<button class="small" ${up?'':'disabled'} onclick="adj('${k}',1)">＋</button>`:''}</span></div>`;}).join('');}
function jobBox(id,prev,p){const j=JOBS[id];const c=p?advCond(p):null;const info=p?jobInfo(p):null;
 const head=info&&info.adv?`ジョブ <b style="color:${j.dark}">${info.name}</b><span class="tag" style="color:var(--gold)">上位</span>`:`ジョブ <b style="color:${j.dark}">${j.name}</b>`;

 await fbToken();

async function rescueList(){
 if(!onlineReady())throw new Error('オンラインに繋がっていません');
 const js=await fsList('rescues');const out=[];
 for(const d of (js.documents||[])){const id=d.name.split('/').pop(),f=d.fields||{};
  const ts=+fv(f,'ts')||0;
  if(Date.now()-ts>RES_TTL){fsDel('rescues/'+id);continue;}
  if(S.rescue&&S.rescue.id===id)continue;
  if(fv(f,'done'))continue;
  const q=QUESTS.find(x=>x.id===+fv(f,'quest'));if(!q)continue;
  out.push({id,name:fv(f,'name')||'名もなき狩人',quest:q,dl:+fv(f,'dl')||1,power:+fv(f,'power')||0,lv:+fv(f,'lv')||1,hr:+fv(f,'hr')||0,ts});}

 const ok=(t,good,hint)=>rows.push(`<div><small style="color:${good?'#9fe07a':'#ff9a8a'}">${good?'✓':'✗'} ${t}</small>${good||!hint?'':'<br><small style="color:#8c8474">　→ '+hint+'</small>'}</div>`);
 ok('https で開いている',location.protocol==='https:','公開URL（https://〜）で開いてください');

 let sw=false;try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();sw=!!(reg&&(reg.active||reg.waiting||reg.installing));}catch(e){}

function playEnding(replay){ED={phase:'talk',i:0,t:0,y:0,fast:1,replay:!!replay};scene='ending';panel=null;
 try{playBgm('title');ambient(null);}catch(e){}renderEnding();}
function renderEnding(){if(!ED)return;
 if(ED.phase==='talk'){setUI(`<div class="intro" onclick="edNext()"><div class="ibox"><div class="ihead"><canvas id="iface" width="19" height="15"></canvas><span class="iname">古参の狩人</span></div>
   <div class="itext">${ED_TALK[ED.i](S.p.name)}</div><div class="inext">▼ タップで次へ<span>${ED.i+1} / ${ED_TALK.length}</span></div></div>
   <button class="iskip" onclick="event.stopPropagation();edSkip()">スキップ</button></div>`);drawTourFace();return;}
 if(ED.phase==='roll'){ED.y0=0;setUI(`<div class="edroll" onclick="ED.fast=ED.fast>1?1:3"><div class="edclip"><div class="edlines" id="edl">${edCredits().map(([k,t])=>`<div class="edl ${k}">${esc(t)||'&nbsp;'}</div>`).join('')}</div></div>
   <button class="iskip" onclick="event.stopPropagation();edSkip()">スキップ</button><div class="edhint">タップで早送り</div></div>`);ED.y=0;return;}
 if(ED.phase==='end'){setUI(`<div class="edend" onclick="edFinish()"><div class="edcont">そして、狩りは続く――</div></div>`);}}
function edNext(){if(!ED)return;ED.i++;try{sfx('ui');}catch(e){}if(ED.i>=ED_TALK.length){ED.phase='roll';ED.t=0;}renderEnding();}
function edSkip(){if(!ED)return;if(ED.phase==='talk'){ED.phase='roll';ED.t=0;renderEnding();return;}ED.phase='end';ED.t=0;renderEnding();}
function edFinish(){if(!ED)return;const replay=ED.replay;ED=null;
 if(!S.endRec)S.endRec={first:Date.now(),n:0};S.endRec.n=(S.endRec.n||0)+1;S.endRec.last=Date.now();
 if(!replay){S.ending=true;S.endingPending=false;S.hrp=S.hrp||0;}save();
 goVillage();if(!replay)setTimeout(()=>{if(scene==='world'){panel='postend';renderWorld();}},300);}
function edTick(dt){if(!ED)return;ED.t+=dt;
 if(ED.phase==='roll'){const el=document.getElementById('edl');if(el){if(!ED.y0){ED.y0=1;ED.y=Math.round(el.parentNode.offsetHeight*0.22);}ED.y+=dt*46*ED.fast;el.style.transform='translateY('+(-ED.y)+'px)';
   if(ED.y>el.offsetHeight+el.parentNode.offsetHeight){ED.phase='end';ED.t=0;renderEnding();}}}
 if(ED.phase==='end'&&ED.t>4.5)edFinish();}
function drawEndingBg(dt){vt+=dt;drawTitleBg(dt);if(!ED||ED.phase==='talk')return;
 // 行進：主人公と村人、倒してきた獣たち
 const g=ctx,gy=Math.round(LH*0.8);g.fillStyle='rgba(20,30,20,.55)';g.fillRect(0,gy+2,LW,LH-gy);
 const d=derived(S.p);const f=1+Math.floor(vt*6)%2;
 const walkers=[{im:playerSprite(d.job,f,d.aid,S.p.look),y:gy-24}];
 NPCS.forEach(n=>walkers.push({im:npcSprite(n),y:gy-22}));
 const tiers=Object.keys((S.rec&&S.rec.mons)||{}).map(Number).filter(t=>MONSTER_TIERS[t]).slice(0,10);
 if(!tiers.includes(14)&&MONSTER_TIERS[14])tiers.push(14);
 tiers.forEach(t=>{const im=monSprite(t,Math.floor(vt*4)%2);const sc=t===14?1:0.7;walkers.push({im,y:gy-im.height*sc,sc});});

by tapping Attack", "うまい！ 回避成功": "Nice! You dodged", "その調子！ 歩けました": "That's it, you're walking!", "この規約について": "About these terms", "この規約は、ゲーム「Beast Hunter（ビーストハンター）」（以下「本ゲーム」）を遊ぶときの約束ごとです。本ゲームを遊ぶ方は、この規約に同意したものとみなします。18歳未満の方は、保護者の方の同意を得てから遊んでください。": "These terms are the agreement for playing the game \"Beast Hunter\". By playing, you agree to them. If you are under 18, please play with a guardian's consent.", "料金": "Fees", "本ゲームは無料で遊べます。今後、広告の表示や、見た目を変えるアイテムの販売などを始める場合があります。その場合は、ゲーム内でお知らせします。": "The game is free to play. In the future we may show ads or sell cosmetic items. If so, we will announce it in game.", "禁止していること": "What's prohibited", "次のことはしないでください。\\n・ゲームを改ざんする、不正な手段で有利に進める\\n・オンライン機能（救援札・集会所など）を妨害する、荒らす\\n・他の人を傷つける、差別的な、わいせつな、または他人になりすます名前を付ける\\n・他の遊び手や運営者に迷惑をかける行為\\n・法律に反する行為\\n運営者は、これらの行為を見つけた場合、オンライン機能の利用を止めるなどの対応をすることがあります。": "Please do not:\n- Tamper with the game or gain an unfair advantage\n- Disrupt or vandalize the online features (rescue posts, meeting hall, etc.)\n- Use a name that is hurtful, discriminatory, obscene, or impersonates someone\n- Cause trouble for other players or the operator\n- Break the law\nIf we find such behavior, we may block access to the online features.", "セーブデータ": "Save data", "セーブデータは、お使いの端末（ブラウザ）の中に保存されます。ブラウザのデータ削除や機種変更で消えることがあるため、大切なデータは設定の「データの引き継ぎ」でコードを控えておいてください。引き継ぎコードは他の人に教えないでください。": "Your save data is stored on your own device (in your browser). It can be lost if you clear browser data or change devices, so keep a transfer code from Settings > Data Transfer. Do not share your transfer code with others.", "内容の変更・停止": "Changes and suspension", "運営者は、本ゲームの内容を予告なく変更したり、公開を一時的に止めたり、終了したりすることがあります。": "The operator may change the game, pause it, or end it without prior notice.", "責任について": "Liability", "運営者は本ゲームを正しく動かすよう努めますが、不具合がないことを保証するものではありません。本ゲームの利用によって生じた損害について、運営者は責任を負いません。ただし、運営者の故意または重大な過失による場合は除きます。": "We do our best to keep the game working, but we do not guarantee it is free of problems. The operator is not liable for damages arising from use of the game, except in cases of intent or gross negligence.", "規約の変更": "Changes to these terms", "この規約を変更した場合は、ゲームを起動したときにお知らせし、あらためて同意をお願いします。": "If these terms change, we will let you know when you start the game and ask you to agree again.", "準拠法": "Governing law", "この規約は日本の法律に従って解釈されます。": "These terms are interpreted under the laws of Japan.", "基本の考え方": "Our approach", "本ゲームは、遊ぶために必要な最小限の情報だけを扱います。本名・住所・メールアドレス・電話番号などを入力していただくことはありません。": "This game handles only the minimum information needed to play. You never enter your real name, address, email address, or phone number.", "端末の中だけに保存するもの": "Stored only on your device", "名前（ゲーム内で付けたもの）、レベル、装備、進行状況などのセーブデータは、お使いの端末（ブラウザ）の中に保存されます。運営者のサーバーには送信しません。": "Your save data (in-game name, level, gear, progress) is stored on your own device (in your browser). It is not sent to the operator's servers.", "オンライン機能を使ったときに送るもの": "Sent when you use online features", "集会所の「救援札」や「仲間と狩る」を使ったときに限り、次の情報をGoogleのサービス「Firebase」に送ります。\\n・自動で発行される匿名のID（本名などとは結びつきません）\\n・救援札の内容（ゲーム内の名前、レベル、総合力、依頼、日時）\\n・仲間とつなぐための接続情報\\n仲間と直接つなぐ仕組み（WebRTC）のため、接続する相手の端末と、IPアドレスなどの通信経路の情報がやりとりされます。": "Only when you use rescue posts or hunt with friends, the following is sent to Google's Firebase:\n- An anonymous ID issued automatically (not linked to your real identity)\n- Rescue post contents (in-game name, level, power, quest, time)\n- Connection data for linking with friends\nBecause friends connect directly (WebRTC), routing information such as IP addresses is exchanged with the other player's device.", "使う目的": "How we use it", "オンライン機能（救援札・仲間との接続）を提供するため、荒らしを防ぐため、不具合を調べるためにだけ使います。": "Only to provide the online features (rescue posts and connecting with friends), to prevent vandalism, and to investigate problems.", "保存する期間": "How long it is kept", "救援札は、およそ3日で一覧から外れ、報酬を受け取った時点で削除されます。仲間とつなぐための情報は、接続が終わると削除されます。": "Rescue posts drop off the list after about 3 days and are deleted once the reward is collected. Connection data is deleted once the connection ends.", "外部のサービス": "External services", "本ゲームは次のサービスを利用しています。各サービスでの情報の扱いは、それぞれの方針に従います。\\n・Firebase（Google LLC）：オンライン機能\\n・GitHub Pages（GitHub, Inc.）：ゲームの配信（アクセスの記録が残る場合があります）\\n・Googleの接続補助サーバー（STUN）：仲間と直接つなぐための通信経路の確認": "This game uses the following services. Information handling at each follows their own policies.\n- Firebase (Google LLC): online features\n- GitHub Pages (GitHub, Inc.): hosting the game (access logs may be recorded)\n- Google connection helper servers (STUN): checking the route for direct connections", "第三者への提供": "Sharing with third parties", "法律で求められる場合を除き、取得した情報を第三者に渡すことはありません。": "We do not provide the information to third parties except where required by law.", "広告について": "About ads", "未成年の方": "If you are a minor", "18歳未満の方は、保護者の方と一緒にこのポリシーを確認してください。": "If you are under 18, please review this policy together with a guardian.", "ポリシーの変更": "Changes to this policy", "このポリシーを変更した場合は、ゲームを起動したときにお知らせします。": "If this policy changes, we will let you know when you start the game.", "本ゲームは、タイトル画面と結果画面に、忍者ツールズ株式会社の広告サービス「忍者AdMax」の広告を表示します。広告の配信のため、同社および提携する広告会社が、Cookieなどを使って閲覧の情報を取得することがあります。取得される情報や止め方は、忍者AdMaxのプライバシーポリシーをご確認ください。広告をタップしたことや見たことで、ゲーム内の報酬がもらえることはありません。": "This game shows ads from Ninja AdMax (Ninja Tools Inc.) on the title screen and the result screen. To deliver ads, that company and its partner ad companies may collect browsing information using cookies and similar technologies. Please see Ninja AdMax's privacy policy for what is collected and how to opt out. Viewing or tapping ads never grants any in-game reward.", "現在、本ゲームは広告を表示していません。広告を始める場合は、このポリシーを更新してお知らせします。": "This game currently shows no ads. If we start showing ads, we will update this policy and let you know.", "ご利用の前に、利用規約とプライバシーポリシーをお読みください。": "Please read the Terms and the Privacy Policy before playing.", "・本名や連絡先を入力していただくことはありません": "- You never enter your real name or contact details", "・セーブデータはお使いの端末の中に保存されます": "- Save data is ers' <b>requests</b> and they'll reward you. Look for the <b>!</b> above their heads.", "<b>池</b>では釣りができる。戦わずに稼ぎたい日はここだな": "You can <b>fish</b> at the pond. Good for days you'd rather not fight.", "門の先は<b>農場</b>だ。畑で薬草を育てて、薬を作れる。着いたらまた案内しよう": "Beyond the gate is the <b>farm</b>. Grow herbs and brew potions. I'll show you around when you get there.", "<b>畑</b>だ。種をまくと、<b>狩りを1回するごとに育つ</b>。実ったら収穫しよう": "The <b>field</b>. Sow seeds and they grow <b>with every hunt</b>. Harvest them when ripe.", "<b>調合小屋</b>。畑の作物と獣の素材から、<b>薬や投げ道具</b>を作れる": "The <b>Brewing Hut</b>. Make <b>potions and throwables</b> from crops and beast materials.", "<b>温泉</b>。浸かると<b>ポイントの振り方をやり直せる</b>（薬草1つ）。ジョブを変えたい時に": "The <b>hot spring</b>. Soak to <b>redistribute your points</b> (costs 1 herb). Use it to change jobs.", "村へはこの門から戻れる。道具が足りなくなったら、ここで作るといい": "This gate leads back to the village. Craft here whenever you run low on items.", "……やったな、": "...You did it, ", "。<br>獣の王が倒れ、森に静けさが戻った": ".<br>The Beast King has fallen, and quiet returns to the forest", "畑の猪を追い払ったあの日から、<br>ずいぶん遠くまで来たもんだ": "You've come a long way<br>since the day you chased a boar off a field", "今日からお前は、この村の誇りだ。<br>……ありがとう": "From today you are the pride of this village.<br>...Thank you", "そして、狩りは続く――": "And the hunt goes on...", "「……だが気をつけろ。王が倒れたことで、": "\"...But stay sharp. With the King fallen, ", "<b>上位の獣たち</b>が目を覚ました」": "<b>greater beasts</b> have awoken.\"", "「ここからが本当の狩りだ。<b>ハンターランク</b>を上げて、どこまで行けるか見せてくれ」": "\"The real hunt starts here. Raise your <b>Hunter Rank</b> and show me how far you can go.\"", "ハンターランクの道が開いた！": "The path of Hunter Rank has opened!", "ゲーム制作": "Game by", "フォント": "Font", "村の人々": "Villagers", "狩りの記録": "Hunt record", "そして": "And", "ここまで遊んでくれた": "to you, who played this far", "総討伐 ": "Total kills ", "出会った獣 ": "Beasts met ", "集めた装備 ": "Gear collected ", "下のボタンで攻撃。まずは「攻撃」を押してみよう": "Attack with the buttons below. Start by tapping Attack", "押したあとボタンが暗くなる間は、次の攻撃を待つ時間だ": "While the button is dark, you're waiting for th   const ax=Math.abs(ix),ay=Math.abs(iy);
