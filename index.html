:root{--ink:#0a0d10;--plate:#252c34;--plate2:#171c22;--bone:#e9e2cf;--bone2:#8c8474;--paper:#252c34;--paper2:#2f3841;--night:#0e1216;--gold:#e0b34e;--blue:#4c8ec7;--red:#c05744;--green:#7ab35c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--night);color:var(--bone);font-family:'DotG',"DotGothic16","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none}
.panel{pointer-events:auto;position:absolute;left:10px;right:10px;background:linear-gradient(180deg,var(--plate),var(--plate2));border:2px solid var(--ink);box-shadow:inset 0 0 0 2px #6b6152,0 6px 18px rgba(0,0,0,.6);padding:14px 13px;color:var(--bone);touch-action:pan-y;overflow:auto}
.panel.center{top:50%;transform:translateY(-50%);max-height:88vh}
.panel.sheet{bottom:118px;max-height:62vh}
.panel.sheet.one{bottom:20px;max-height:70vh}
h1,h2{margin:0 0 8px;font-weight:700}
h1{font-size:21px;color:var(--gold)}h2{font-size:17px;color:var(--gold);border-bottom:2px solid #6b6152;padding-bottom:5px}
p{margin:6px 0;line-height:1.5;font-size:14px}
small{font-size:12px}
button{font:inherit;font-size:15px;background:linear-gradient(180deg,#39424d,#232a32);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px #6b6152;padding:10px 12px;color:var(--bone);margin:4px 2px;border-radius:0}
button:active{transform:translateY(1px);filter:brightness(1.25)}
button.pri{background:linear-gradient(180deg,#f0c96a,#b98a2c);color:#1b1408;text-shadow:none}
button.small{font-size:13px;padding:6px 10px}
button.on{background:linear-gradient(180deg,#f0c96a,#b98a2c);color:#1b1408}
button:disabled{opacity:.45}
input[type=text]{font:inherit;font-size:16px;padding:9px;border:2px solid var(--ink);box-shadow:inset 0 0 0 1px #6b6152;background:#12171c;color:var(--bone);width:100%;user-select:text;-webkit-user-select:text;margin-bottom:6px}
.row{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.stat{display:grid;grid-template-columns:4.4em 1fr auto;align-items:center;gap:6px;margin:4px 0}
.bar{height:10px;background:#12171c;border:2px solid #6b6152;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue)}
.job{border:2px solid #6b6152;padding:8px;margin:8px 0;background:rgba(224,179,78,.10)}
.job b{font-size:18px}
.item{border:1px solid #444d57;border-left:4px solid var(--gold);padding:8px;margin:6px 0;background:rgba(255,255,255,.045);display:flex;justify-content:space-between;align-items:center;gap:8px}
.item.lock{border-left-color:#555;opacity:.6}
.stars{color:var(--gold);letter-spacing:1px}
.rec{display:grid;grid-template-columns:1fr auto auto;gap:6px;font-size:13px;padding:4px 0;border-bottom:1px solid #39424d}
.codex{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.codex div{border:1px solid #6b6152;padding:4px 7px;font-size:12px;background:rgba(0,0,0,.25);color:#6f6a5e}
.codex div.got{color:#1b1408;background:linear-gradient(180deg,#f0c96a,#b98a2c);border-color:var(--ink)}
.mark{font-size:24px;width:1.3em;text-align:center}
.hud{position:absolute;left:10px;top:10px;pointer-events:none;color:#fff;text-shadow:2px 2px 0 #000;font-size:13px;line-height:1.5}
.hud.r{left:auto;right:10px;text-align:right}
.hpbar{height:12px;border:1px solid #000;box-shadow:inset 0 0 0 1px #6b6152;background:#12171c;margin:5px 0 5px;width:142px}
.hpbar i{display:block;height:100%;background:#57d05a}
.mhp{height:10px;border:1px solid #000;box-shadow:inset 0 0 0 1px #6b6152;background:#12171c;margin-top:3px;width:142px;margin-left:auto}
.mhp i{display:block;height:100%;background:#e0493a}
.tele{position:absolute;left:0;right:0;top:72px;text-align:center;pointer-events:none;color:#fff;text-shadow:2px 2px 0 #000;font-size:15px;font-weight:700}
.tele .tb{width:170px;height:8px;border:1px solid #000;box-shadow:inset 0 0 0 1px #6b6152;background:#12171c;margin:5px auto 0}
.tele .tb i{display:block;height:100%;background:#ff5a4a}
.bctl{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 8px calc(10px + env(safe-area-inset-bottom));pointer-events:auto;background:linear-gradient(transparent,rgba(0,0,0,.4))}
.bctl button{margin:0;height:68px;padding:0;font-size:14px;line-height:1.15;position:relative;overflow:hidden}
#party{margin-top:4px}
.pm{font-size:11px;color:var(--bone);text-shadow:1px 1px 0 #000;margin-top:2px}
.pm small{font-size:10px;opacity:.85}
.pb{height:7px;width:120px;border:1px solid #000;box-shadow:inset 0 0 0 1px #6b6152;background:#12171c}
.pb i{display:block;height:100%;background:#57d05a}
.rowlab{position:absolute;transform:translate(-50%,0);font-size:11px;color:var(--bone);background:rgba(14,18,22,.7);border:1px solid #6b6152;padding:2px 7px;pointer-events:none;white-space:nowrap}
.rowlab.here{background:linear-gradient(180deg,#f0c96a,#b98a2c);color:#1b1408}
.rowlab.danger{background:rgba(192,87,68,.92);color:#fff;border-color:#f0a090}
.flash{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:20px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .15s;text-shadow:2px 2px 0 #000}
.bctl button small{display:block;font-size:11px}
.bctl button em{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);font-style:normal;pointer-events:none}
.bctl .a{background:linear-gradient(180deg,#f0c96a,#b98a2c);color:#1b1408}.bctl .s{background:linear-gradient(180deg,#7fc8f5,#3a7fae);color:#0b1a24}.bctl .m{background:linear-gradient(180deg,#d8dde2,#8b949d);color:#12171c}.bctl .i{background:linear-gradient(180deg,#b8d98a,#6f9a4a);color:#12210b}
.quit{position:absolute;left:50%;transform:translateX(-50%);top:10px;pointer-events:auto}
.toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);background:rgba(10,13,16,.92);color:var(--bone);padding:8px 14px;font-size:14px;border:1px solid #6b6152;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;max-width:86vw}
.vmenu{pointer-events:auto;position:absolute;left:0;right:0;bottom:0;padding:6px 8px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.4))}
.vmenu .g{display:grid;gap:0}
.vmenu .g4{grid-template-columns:repeat(4,1fr)}.vmenu .g3{grid-template-columns:repeat(3,1fr)}
.vmenu button{margin:3px;padding:10px 2px;font-size:13px}
.vmenu .lbl{color:#fff;text-shadow:1px 1px 0 #000;font-size:11px;margin:2px 6px 0}
.bub{pointer-events:auto;position:absolute;transform:translate(-50%,-100%);background:linear-gradient(180deg,var(--plate),var(--plate2));border:2px solid var(--ink);box-shadow:inset 0 0 0 2px #6b6152,0 5px 14px rgba(0,0,0,.6);padding:8px 10px;width:66vw;max-width:280px;display:none}
.bub:after{content:'';position:absolute;left:50%;bottom:-9px;margin-left:-6px;border:6px solid transparent;border-top-color:#6b6152}
.bub.down{transform:translate(-50%,0)}
.bub.down:after{top:-9px;bottom:auto;border-top-color:transparent;border-bottom-color:var(--ink)}
.bub .x{position:absolute;right:-10px;top:-12px;width:26px;height:26px;padding:0;margin:0;font-size:14px;line-height:1;border-radius:50%}
.bub b{font-size:14px;color:var(--gold)}.bub p{margin:2px 0;font-size:12px}
.bub button{font-size:13px;padding:6px 9px;margin:4px 2px 0}
#stick,#sb,#sk,#sb i{touch-action:none;-ms-touch-action:none}
#stick{position:absolute;left:0;bottom:0;width:60%;height:52%;pointer-events:auto}
#sb{position:absolute;left:22px;bottom:26px;width:104px;height:104px;border-radius:50%;border:3px solid rgba(233,226,207,.55);background:radial-gradient(rgba(14,18,22,.30),rgba(14,18,22,.16));box-shadow:0 0 0 2px rgba(10,13,16,.45);transition:opacity .15s}
#sb.act{transition:none;bottom:auto}
#sb:before{content:'';position:absolute;inset:8px;border-radius:50%;border:1px dashed rgba(233,226,207,.28)}
#sk{position:absolute;left:29px;top:29px;width:46px;height:46px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.85),rgba(200,192,170,.65));border:2px solid rgba(10,13,16,.5);box-shadow:0 2px 0 rgba(10,13,16,.35)}
#sb i{position:absolute;color:rgba(233,226,207,.5);font-size:11px;line-height:1}
#sb i.u{left:50%;top:3px;transform:translateX(-50%)}#sb i.d{left:50%;bottom:3px;transform:translateX(-50%)}
#sb i.l{left:4px;top:50%;transform:translateY(-50%)}#sb i.r{right:4px;top:50%;transform:translateY(-50%)}
.sign{position:absolute;transform:translate(-50%,-100%);background:rgba(14,18,22,.85);border:1px solid #6b6152;color:var(--bone);font-size:11px;line-height:1;padding:3px 7px;white-space:nowrap;pointer-events:none}
.sign.near{background:linear-gradient(180deg,#f0c96a,#b98a2c);color:#1b1408;border-color:var(--ink)}
#signs{position:absolute;inset:0;pointer-events:none}
.hint{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;color:#fff;text-shadow:2px 2px 0 #000;font-size:12px;pointer-events:none}
.tag{display:inline-block;padding:1px 6px;border:1px solid #6b6152;font-size:12px;margin-left:4px;background:rgba(0,0,0,.3);text-shadow:none;color:var(--bone)}
details{margin:8px 0}summary{font-size:14px}
</style>

const sprCache=new Map();
const OUTLINE='#1a1219';
function lighten(hex,k){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.round(r+(255-r)*k);g=Math.round(g+(255-g)*k);b=Math.round(b+(255-b)*k);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function rawSprite(rows,pal){const w=rows[0].length,h=rows.length;const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=rows[y][x];if(ch==='.')continue;const col=pal[ch];if(!col)continue;g.fillStyle=col;g.fillRect(x,y,1,1);}return c;}
function outlineRows(g,layers,col){const rows=layers[0],h=rows.length,w=rows[0].length;
 const solid=(x,y)=>{if(x<0||y<0||x>=w||y>=h)return false;for(let i=0;i<layers.length;i++){const r=layers[i][y];if(r&&r[x]&&r[x]!=='.')return true;}return false;};
 g.fillStyle=col;
 for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){if(solid(x,y))continue;if(solid(x-1,y)||solid(x+1,y)||solid(x,y-1)||solid(x,y+1))g.fillRect(x+1,y+1,1,1);}}
function composite(layers,pals,col){const h=layers[0].length,w=layers[0][0].length;
 const c=document.createElement('canvas');c.width=w+2;c.height=h+2;const g=c.getContext('2d');
 outlineRows(g,layers,col);
 for(let i=0;i<layers.length;i++)g.drawImage(rawSprite(layers[i],pals[i]),1,1);
 return c;}
function sprite(rows,pal,key){if(sprCache.has(key))return sprCache.get(key);const c=rawSprite(rows,pal);sprCache.set(key,c);return c;}
const PAL_P={h:'#3a2a24',H:'#5c4133',s:'#f5d0a9',S:'#d6a279',m:'#b06a58',w:'#ffffff',e:'#2a3242',l:'#4f4030',L:'#6d5843',b:'#2e2218',k:'#2f2118'};
function flatPal(rows,col){const pal={};rows.forEach(r=>{for(const ch of r)if(ch!=='.')pal[ch]=col;});return pal;}
function playerSprite(job,f){const key='P'+job+f;if(sprCache.has(key))return sprCache.get(key);const j=JOBS[job];
 const o=composite([BODY[f],JOB_GEAR[job]],[Object.assign({t:j.color,T:lighten(j.color,0.28),d:j.dark},PAL_P),{1:j.color,2:j.dark,3:'#f2eee2',4:'#a3adb6',5:'#6b757e'}],OUTLINE);
 sprCache.set(key,o);return o;}
function playerFlash(f){const key='PF'+f;if(sprCache.has(key))return sprCache.get(key);const o=composite([BODY[f]],[flatPal(BODY[f],'#fff')],'#fff');sprCache.set(key,o);return o;}

function nbuf(c){if(AU.nb)return AU.nb;const n=c.createBuffer(1,c.sampleRate*0.4,c.sampleRate),d=n.getChannelData(0);
 for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.nb=n;return n;}
function tone(f0,f1,dur,type,vol,dly){const c=ac();if(!c)return;const t=c.currentTime+(dly||0);
 const o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f0,t);
 if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||0.08,t+0.008);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
 o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02);}
function noise(dur,vol,f0,f1,dly){const c=ac();if(!c)return;const t=c.currentTime+(dly||0);
 const s=c.createBufferSource();s.buffer=nbuf(c);const f=c.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(f0||900,t);
 if(f1)f.frequency.exponentialRampToValueAtTime(Math.max(60,f1),t+dur);f.Q.value=1.1;
 const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||0.08,t+0.006);g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
 s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);s.stop(t+dur+0.02);}
function sfx(n){if(!sfxOn())return;if(!ac())return;
 switch(n){
  case'ui':tone(720,900,0.05,'square',0.05);break;
  case'swing':noise(0.13,0.07,1700,420);break;
  case'shot':tone(880,300,0.1,'sawtooth',0.05);noise(0.08,0.04,2200,900);break;
  case'hit':noise(0.1,0.09,520,180);tone(180,90,0.1,'square',0.05);break;
  case'crit':noise(0.16,0.1,900,200);tone(420,120,0.18,'square',0.07);tone(780,240,0.14,'triangle',0.05,0.02);break;
  case'hurt':tone(260,70,0.22,'sawtooth',0.08);noise(0.14,0.06,420,140);break;
  case'dodge':noise(0.16,0.055,2600,700);break;
  case'mikiri':tone(1180,1560,0.09,'triangle',0.06);tone(1560,1900,0.1,'triangle',0.05,0.07);break;
  case'guard':tone(300,220,0.2,'square',0.06);noise(0.1,0.05,700,300);break;
  case'skill':tone(520,1040,0.16,'square',0.07);tone(780,1560,0.14,'triangle',0.05,0.05);break;
  case'heal':tone(620,930,0.14,'triangle',0.06);tone(930,1240,0.16,'triangle',0.05,0.09);break;
  case'warn':tone(980,980,0.07,'square',0.06);tone(980,980,0.07,'square',0.06,0.12);break;
  case'buy':tone(880,1320,0.08,'square',0.06);tone(1320,1760,0.1,'square',0.05,0.07);break;
  case'lvup':[523,659,784,1047].forEach((f,i)=>tone(f,f,0.14,'square',0.06,i*0.09));break;
  case'win':[523,659,784,1047,1319].forEach((f,i)=>tone(f,f,0.18,'square',0.06,i*0.11));break;
  case'lose':[392,330,262,196].forEach((f,i)=>tone(f,f*0.98,0.26,'triangle',0.06,i*0.15));break;
  case'die':noise(0.4,0.1,700,90);tone(160,50,0.4,'sawtooth',0.07);break;
 }}

function newPlayer(name){const st={};STAT_KEYS.forEach(k=>st[k]=BASE);const mats={};Object.keys(MATS).forEach(k=>mats[k]=0);return{name,lv:1,exp:0,pts:LV1_PTS,stats:st,auto:null,gold:120,herb:0,items:{potion:1,seed:3},mats,gear:[],eq:{w:null,a:null},upg:{},cleared:0,resets:0};}

function migrate(){const P=S.p;if(!P.upg)P.upg={};if(!P.resets)P.resets=0;if(!P.mats)P.mats={};Object.keys(MATS).forEach(k=>{if(P.mats[k]===undefined)P.mats[k]=0;});if(!S.rec)S.rec={q:{},jobs:{},mons:{}};if(!S.rec.mons)S.rec.mons={};if(!S.opt)S.opt={sfx:true};if(!S.rec)S.rec={q:{},jobs:{}};if(!S.rec.q)S.rec.q={};if(!S.rec.jobs)S.rec.jobs={};S.farm.plots.forEach(pl=>{if(pl.planted&&pl.stage===0)pl.stage=1;});}
function qrec(id){if(!S.rec.q[id])S.rec.q[id]={n:0,best:0};return S.rec.q[id];}
function fmtTime(ms){if(!ms)return'--';const t=Math.round(ms/100)/10;const m=Math.floor(t/60),sec=(t-m*60).toFixed(1);return m?m+'分'+sec+'秒':sec+'秒';}

// ===== ジョブ判定・能力値 =====
function computeJob(s){const tot=STAT_KEYS.reduce((a,k)=>a+s[k],0);const mx=Math.max(...STAT_KEYS.map(k=>s[k]));const isMax=k=>s[k]===mx;
 if(isMax('str')&&s.str>=tot*0.35)return'kenshi';if(isMax('dex')&&s.dex>=s.str*1.3)return'karyudo';if(isMax('vit')&&s.vit>=s.str*1.2)return'shugo';
 const mm=s.mag+s.mnd;if(mm>=tot*0.5&&Math.abs(s.mag-s.mnd)<=mm*0.25)return'kenja';if(isMax('mag')&&s.mag>=s.mnd*1.4)return'madou';if(isMax('mnd')&&s.mnd>=s.mag*1.4)return'iyashi';return'bouken';}
function gearBonus(p){const b={atk:0,atkD:0,atkM:0,heal:0,hp:0,def:0};['w','a'].forEach(sl=>{const id=p.eq[sl],g=GEAR[id];if(!g)return;const lv=(p.upg&&p.upg[id])||0;for(const k in b){const v=g[k]||0;b[k]+=v+(v?Math.round(v*0.15*lv):0);}});return b;}
function derived(p){const s=p.stats,g=gearBonus(p);const job=computeJob(s);const defp=(job==='shugo'?25:0)+g.def;return{job,hp:40+s.vit*6+g.hp,atk:4+s.str*1.3+s.dex*0.5+g.atk,atkD:4+s.dex*1.3+s.str*0.4+g.atkD,atkM:4+s.mag*1.3+s.mnd*0.5+g.atkM,heal:10+s.mnd*1.5+g.heal,cdMul:1-Math.min(s.dex,40)*0.01,teleMul:1+Math.min(s.mnd,40)*0.02,def:1-defp/100,wtype:GEAR[p.eq.w]?GEAR[p.eq.w].type:null};}
function power(p){const g=gearBonus(p);return STAT_KEYS.reduce((a,k)=>a+p.stats[k],0)+p.lv*3+Math.round(g.atk+g.atkD+g.atkM+g.hp/5+g.def/2);}
function mark(p,q){const pw=power(p);return pw>=q.req?'◎':pw>=q.req*0.75?'○':'△';}
function needExp(lv){return 20+lv*12;}
function gainExp(p,e){p.exp+=e;const ups=[];while(p.exp>=needExp(p.lv)){p.exp-=needExp(p.lv);p.lv++;p.pts+=PTS_PER_LV;ups.push(p.lv);}return ups;}
function allocAuto(p,w){const pts=p.pts;if(pts<=0)return;const tw=STAT_KEYS.reduce((a,k)=>a+(w[k]||0),0);if(!tw)return;const exact={},add={};let used=0;STAT_KEYS.forEach(k=>{exact[k]=pts*(w[k]||0)/tw;add[k]=Math.floor(exact[k]);used+=add[k];});const rem=STAT_KEYS.slice().sort((a,b)=>(exact[b]-add[b])-(exact[a]-add[a]));for(let i=0;used<pts;i++){add[rem[i%5]]++;used++;}STAT_KEYS.forEach(k=>p.stats[k]+=add[k]);p.pts=0;}
function gearName(id){const lv=(S&&S.p.upg&&S.p.upg[id])||0;return GEAR[id].name+(lv?' +'+lv:'');}
function gearDesc(g,lv){if(lv){const o={};for(const k in g)if(typeof g[k]==='number'&&['atk','atkD','atkM','heal','hp','def'].includes(k))o[k]=g[k]+Math.round(g[k]*0.15*lv);g=Object.assign({},g,o);}
const o=[];if(g.atk)o.push('攻撃+'+g.atk);if(g.atkD)o.push('弓+'+g.atkD);if(g.atkM)o.push('魔法+'+g.atkM);if(g.heal)o.push('回復+'+g.heal);if(g.hp)o.push('HP+'+g.hp);if(g.def)o.push('防御+'+g.def+'%');return o.join(' ');}

// ===== 農場・店・装備の処理 =====
function farmQuestBoost(){let any=false;S.farm.plots.forEach(pl=>{if(pl.planted&&pl.stage<3){pl.stage=3;any=true;}});return any;}
function plant(i){const P=S.p;if(P.items.seed<=0){toast('種がない。村の道具屋で買える');return;}const pl=S.farm.plots[i];P.items.seed--;pl.planted=true;pl.stage=1;save();toast('種をまいた。クエストを1つクリアすると実る');}
function harvest(i){const pl=S.farm.plots[i];if(!pl.planted||pl.stage<3)return;S.p.herb+=2;S.p.items.seed+=2;pl.planted=false;pl.stage=0;save();toast('薬草2つと種2つを収穫');}
function brew(){if(S.p.herb<2)return;S.p.herb-=2;S.p.items.potion++;save();toast('回復薬をつくった');rerender();}
function expand(){if(S.p.mats.tusk<3||S.farm.plots.length>=3)return;S.p.mats.tusk-=3;S.farm.plots.push({planted:false,stage:0});save();toast('畑が広がった');}
function allocated(){return STAT_KEYS.reduce((a,k)=>a+S.p.stats[k]-BASE,0);}
function resetLeft(){return RESET_LIMIT?Math.max(0,RESET_LIMIT-S.p.resets):Infinity;}
function askSpring(){openPanel('springAsk');}
function doSpring(){const P=S.p;if(P.herb<1){toast('薬草が1つ必要');return;}if(resetLeft()<=0){toast('もう振り直せない');return;}const alloc=allocated();if(alloc<=0)return;P.herb--;P.resets++;STAT_KEYS.forEach(k=>P.stats[k]=BASE);P.pts+=alloc;P.auto=null;save();openPanel('sprung');}
function buyItem(id){const it=ITEMS[id];if(S.p.gold<it.price){toast('ゴールドが足りない');return;}S.p.gold-=it.price;S.p.items[id]++;save();toast(it.name+'を買った');rerender();}
function buyGear(id){const g=GEAR[id];if(S.p.gear.includes(id)){toast('もう持っている');return;}if(S.p.gold<g.price){toast('ゴールドが足りない');return;}S.p.gold-=g.price;S.p.gear.push(id);sfx('buy');const eqd=!S.p.eq[g.slot];if(eqd)S.p.eq[g.slot]=id;save();toast(g.name+'を買った'+(eqd?'（装備した）':''));rerender();}
function craftGear(id){const g=GEAR[id];if(S.p.gear.includes(id)){toast('もう持っている');return;}for(const k in g.craft)if((S.p.mats[k]||0)<g.craft[k]){toast(MATS[k]+'が足りない');return;}if(S.p.gold<g.gold){toast('ゴールドが足りない');return;}for(const k in g.craft)S.p.mats[k]-=g.craft[k];S.p.gold-=g.gold;S.p.gear.push(id);S.p.eq[g.slot]=id;sfx('buy');save();toast(g.name+'をつくった（装備した）');rerender();}
function upgradeGear(id){const P=S.p,lv=P.upg[id]||0;if(lv>=UPG_MAX)return;const c=upgCost(lv);if(P.gold<c.gold||P.mats.tusk<c.tusk||P.mats.hide<c.hide){toast('材料かゴールドが足りない');return;}P.gold-=c.gold;P.mats.tusk-=c.tusk;P.mats.hide-=c.hide;P.upg[id]=lv+1;sfx('buy');save();toast(GEAR[id].name+' が +'+(lv+1)+' になった');rerender();}
function equip(slot,id){S.p.eq[slot]=id||null;save();rerender();}

function adj(k,d){if(!T)return;if(d>0){if(T.pts<=0)return;T.stats[k]++;T.pts--;}else{if(T.stats[k]<=T._floor[k])return;T.stats[k]--;T.pts++;}T.auto=null;rerender();}
function pickPreset(id){if(!T)return;const pr=PRESETS.find(x=>x.id===id);STAT_KEYS.forEach(k=>{T.pts+=T.stats[k]-T._floor[k];T.stats[k]=T._floor[k];});allocAuto(T,pr.w);T.auto=pr.w;rerender();}
function statRows(o,ed){return STAT_KEYS.map(k=>{const v=o.stats[k];const dn=ed&&v>o._floor[k],up=ed&&o.pts>0;return`<div class="stat"><span><b>${STAT_NAME[k]}</b><br><small style="font-size:10px">${STAT_HINT[k]}</small></span><div class="bar"><i style="width:${Math.min(100,v/40*100)}%"></i></div><span class="row">${ed?`<button class="small" ${dn?'':'disabled'} onclick="adj('${k}',-1)">−</button>`:''}<b style="min-width:2em;text-align:center">${v}</b>${ed?`<button class="small" ${up?'':'disabled'} onclick="adj('${k}',1)">＋</button>`:''}</span></div>`;}).join('');}
function jobBox(id,prev){const j=JOBS[id];return`<div class="job" style="border-color:${j.dark}">ジョブ <b style="color:${j.dark}">${j.name}</b>${prev&&prev!==id?`<span class="tag">${JOBS[prev].name}から変化</span>`:''}<br><small>発現条件：${j.rule}</small><br><small>スキル「${j.skill}」：${j.skillDesc}</small></div>`;}

function jobList(){return`<details><summary>ジョブ一覧と発現条件</summary>${Object.keys(JOBS).map(k=>`<p><b style="color:${JOBS[k].dark}">${JOBS[k].name}</b>：${JOBS[k].rule}<br><small>${JOBS[k].skill}：${JOBS[k].skillDesc}</small></p>`).join('')}</details>`;}
function hudHTML(){const P=S.p,d=derived(P);return`<div class="hud"><b>${esc(P.name)}</b> Lv${P.lv} <span class="tag" style="color:${JOBS[d.job].dark}">${JOBS[d.job].name}</span><br>${P.gold}G　回復薬 ${P.items.potion}　薬草 ${P.herb}　種 ${P.items.seed}${P.pts>0?`<br><b style="color:#ffd35a">ポイントが ${P.pts} 残っている → 家で育成</b>`:''}</div>`;}

function inRect(r,x,y,pad){pad=pad||0;return x>r.x-pad&&x<r.x+r.w+pad&&y>r.y-pad&&y<r.y+r.h+pad;}

function renderWorld(){const body=PANELS[panel]?PANELS[panel]():'';
 const signs=curMap().spots.map(sp=>`<div class="sign" data-id="${sp.id}">${sp.name}</div>`).join('');
 const ctl=panel?'':`<div id="signs">${signs}</div><div id="stick"><div id="sb"><i class="u">▲</i><i class="d">▼</i><i class="l">◀</i><i class="r">▶</i><div id="sk"></div></div></div><div class="bub" id="bub"></div>${W.near?'':'<div class="hint">左下のパッドで歩く／施設に触れると吹き出しが出ます</div>'}`;
 setUI(`${hudHTML()}${body}${ctl}<div class="toast" id="toast"></div>`);if(!panel){bubSig='';bindStick();}}
const SB_R=52,SK_R=23,SK_MAX=29;
function stickHome(){const sb=$('#sb'),sk=$('#sk');if(!sb)return;sb.classList.remove('act');sb.style.left='22px';sb.style.top='';sk.style.left=(SB_R-SK_R)+'px';sk.style.top=(SB_R-SK_R)+'px';}
function bindStick(){const st=$('#stick'),sb=$('#sb'),sk=$('#sk');if(!st)return;let pid=null,ox=0,oy=0;stickHome();
 st.addEventListener('pointerdown',e=>{if(pid!==null)return;pid=e.pointerId;ox=e.clientX;oy=e.clientY;stick.on=true;stick.dx=0;stick.dy=0;
  const r=st.getBoundingClientRect();sb.classList.add('act');sb.style.left=(ox-SB_R-r.left)+'px';sb.style.top=(oy-SB_R-r.top)+'px';
  sk.style.left=(SB_R-SK_R)+'px';sk.style.top=(SB_R-SK_R)+'px';try{st.setPointerCapture(pid);}catch(err){}e.preventDefault();});
 st.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;let dx=e.clientX-ox,dy=e.clientY-oy;const l=Math.hypot(dx,dy);if(l>SK_MAX){dx=dx/l*SK_MAX;dy=dy/l*SK_MAX;}stick.dx=dx/SK_MAX;stick.dy=dy/SK_MAX;sk.style.left=(SB_R-SK_R+dx)+'px';sk.style.top=(SB_R-SK_R+dy)+'px';});
 const up=e=>{if(pid!==null&&e.pointerId!==pid)return;pid=null;stick.on=false;stick.dx=0;stick.dy=0;stickHome();};
 st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);st.addEventListener('lostpointercapture',up);
 // 予備経路：pointerイベントが来ない端末向け
 let tid=null;
 const tStart=e=>{if(pid!==null)return;const t=e.changedTouches[0];tid=t.identifier;ox=t.clientX;oy=t.clientY;stick.on=true;stick.dx=0;stick.dy=0;
  const r=st.getBoundingClientRect();sb.classList.add('act');sb.style.left=(ox-SB_R-r.left)+'px';sb.style.top=(oy-SB_R-r.top)+'px';
  sk.style.left=(SB_R-SK_R)+'px';sk.style.top=(SB_R-SK_R)+'px';e.preventDefault();};
 const tMove=e=>{if(tid===null)return;for(const t of e.changedTouches){if(t.identifier!==tid)continue;let dx=t.clientX-ox,dy=t.clientY-oy;const l=Math.hypot(dx,dy);if(l>SK_MAX){dx=dx/l*SK_MAX;dy=dy/l*SK_MAX;}stick.dx=dx/SK_MAX;stick.dy=dy/SK_MAX;sk.style.left=(SB_R-SK_R+dx)+'px';sk.style.top=(SB_R-SK_R+dy)+'px';}e.preventDefault();};
 const tEnd=e=>{if(tid===null)return;tid=null;stick.on=false;stick.dx=0;stick.dy=0;stickHome();};
 st.addEventListener('touchstart',tStart,{passive:false});st.addEventListener('touchmove',tMove,{passive:false});
 st.addEventListener('touchend',tEnd);st.addEventListener('touchcancel',tEnd);}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(scene==='battle')pressed.push(k);if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)&&scene!=='create')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function renderBubble(){const b=$('#bub');if(!b)return;const sp=W.near&&spotById(W.near);if(!sp){b.style.display='none';return;}const acts=sp.acts(sp);
 b.innerHTML=`<button class="x" onclick="dismissSpot()">×</button><b>${sp.name}</b><p>${sp.say(sp)}</p><div class="row">${acts.map((a,i)=>`<button class="pri" ${a.dis?'disabled':''} onclick="spotAct(${i})">${a.l}</button>`).join('')}</div>`;
 b.className='bub'+(sp.below?' down':'');b.style.display='block';}
function dismissSpot(){W.skip=W.near;W.near=null;bubSig='';const b=$('#bub');if(b)b.style.display='none';}
function spotAct(i){const sp=W.near&&spotById(W.near);if(!sp)return;const a=sp.acts(sp)[i];if(!a||a.dis)return;a.f();if(!PANELS[panel]){bubSig='';renderWorld();}}
function updateWorld(dt){const m=curMap();
 if(panel){stick.dx=0;stick.dy=0;return;}
 let ix=0,iy=0;if(keys.arrowleft||keys.a)ix-=1;if(keys.arrowright||keys.d)ix+=1;if(keys.arrowup||keys.w)iy-=1;if(keys.arrowdown||keys.s)iy+=1;if(stick.on){ix=stick.dx;iy=stick.dy;}
 let len=Math.hypot(ix,iy);if(len<0.2){ix=0;iy=0;len=0;}else{ix/=len;iy/=len;}
 W.moving=len>0;
 if(len>0){const sp=62*dt;const solids=m.spots.filter(s=>s.solid).map(s=>s.rect).concat(m.blocks||[]);
  let nx=clamp(W.x+ix*sp,8,m.w-8);if(!solids.some(r=>inRect(r,nx,W.y,2)))W.x=nx;
  let ny=clamp(W.y+iy*sp,16,m.h-6);if(!solids.some(r=>inRect(r,W.x,ny,2)))W.y=ny;
  W.anim+=dt*8;if(ix!==0)W.fx=ix<0?-1:1;}
 const bx=W.x,by=W.y-5;let near=null;m.spots.forEach(sp=>{if(!inRect(sp.rect,bx,by,TOUCH_PAD))return;const cx=sp.rect.x+sp.rect.w/2,cy=sp.rect.y+sp.rect.h/2,d=Math.hypot(cx-bx,cy-by);if(!near||d<near.d)near={sp,d};});
 if(W.skip&&(!near||near.sp.id!==W.skip))W.skip=null;
 const id=near&&near.sp.id!==W.skip?near.sp.id:null;
 if(id!==W.near){W.near=id;bubSig='';}}

function smithHTML(){const P=S.p;const tab=smithTab;
 const head=`<div class="panel sheet one"><h2>鍛冶屋</h2><p>所持 ${P.gold}G　${Object.keys(MATS).map(k=>MATS[k]+' '+P.mats[k]).join('　')}</p><div class="row"><button class="small ${tab==='craft'?'on':''}" onclick="smithTab='craft';rerender()">つくる</button><button class="small ${tab==='upg'?'on':''}" onclick="smithTab='upg';rerender()">強化する</button></div>`;
 let body;
 if(tab==='craft')body=SMITH_LIST.map(id=>{const g=GEAR[id],own=P.gear.includes(id);const ok=!own&&P.gold>=g.gold&&Object.keys(g.craft).every(k=>P.mats[k]>=g.craft[k]);return`<div class="item"><div><b>${g.name}</b>${own?'<span class="tag">所持</span>':''}<br><small>${gearDesc(g)}</small><br><small>材料 ${Object.keys(g.craft).map(k=>MATS[k]+'×'+g.craft[k]).join(' ')}＋${g.gold}G</small></div><button class="small pri" ${ok?'':'disabled'} onclick="craftGear('${id}')">つくる</button></div>`;}).join('');
 else{const own=P.gear;body=own.length?own.map(id=>{const g=GEAR[id],lv=P.upg[id]||0;if(lv>=UPG_MAX)return`<div class="item"><div><b>${g.name} +${lv}</b><span class="tag">最大</span><br><small>${gearDesc(g,lv)}</small></div></div>`;

 return head+body+`<button onclick="closePanel()">閉じる</button></div>`;}

function monNote(){const seen=Object.keys(S.rec.mons||{}).map(Number).sort((a,b)=>a-b);
 if(!seen.length)return '<p><small>まだ出会っていない</small></p>';
 return seen.map(i=>{const D=MONSTER_TIERS[i];if(!D)return'';const atks=[...new Set(D.pattern)].map(k=>{const a=ATTACKS[k];const rn=r=>r==='front'?'前':'後';return a.name+'（'+(a.seq?a.seq.map(rn).join('→'):a.rows.map(rn).join('と'))+'）';}).join('　');

 try{const bc=new BroadcastChannel('softjob-'+room);bc.onmessage=e=>onMsg(e.data);
  return {kind:'local',send:m=>{try{bc.postMessage(m);}catch(e){}},close:()=>{try{bc.close();}catch(e){}}};}catch(e){}
 const key='softjob_net_'+room;const h=e=>{if(e.key!==key||!e.newValue)return;try{onMsg(JSON.parse(e.newValue).m);}catch(err){}};
 addEventListener('storage',h);
 return {kind:'storage',send:m=>{try{localStorage.setItem(key,JSON.stringify({m,n:Math.random()}));}catch(e){}},close:()=>removeEventListener('storage',h)};}

 if(NET.mode==='online'){NET.tp={kind:'online',send:onlineSend,close:()=>{}};

function onNetMsg(msg){if(!NET.on||!msg||msg.from===NET.id)return;
 switch(msg.t){
  case'hello':{if(!NET.host)return;if(Object.keys(NET.ps).length>=4){netSend({t:'full',to:msg.from});return;}
   NET.ps[msg.from]={id:msg.from,name:msg.name,lv:msg.lv,job:msg.job,power:msg.power,d:msg.d,t:Date.now()};
   toast(msg.name+' が入った');netLobby();if(scene==='battle')netSend({t:'busy',to:msg.from});if(scene==='world')rerender();break;}
  case'lobby':{if(NET.host)return;NET.ps={};msg.ps.forEach(p=>{NET.ps[p.id]=p;});NET.hostId=msg.host;if(scene==='world')rerender();break;}
  case'bye':{if(NET.host&&NET.ps[msg.from]){toast(NET.ps[msg.from].name+' が抜けた');delete NET.ps[msg.from];netLobby();if(scene==='world')rerender();}
   else if(!NET.host&&msg.from===NET.hostId){toast('ホストが抜けた');netClose();if(scene==='battle'){B=null;goVillage();}else rerender();}break;}
  case'full':{if(msg.to===NET.id){toast('満員で入れなかった');netClose();rerender();}break;}
  case'busy':{if(msg.to===NET.id)toast('ホストは今クエスト中。終わるまで待とう');break;}
  case'start':{if(NET.host)return;const others=msg.ps.filter(p=>p.id!==NET.id);
   beginQuest(msg.qi,{me:NET.id,host:false,others});break;}
  case'act':{if(!NET.host||!B||B.over)return;const p=B.ps[msg.from];if(!p)return;
   if(msg.a==='atk')actAttack(null,p);else if(msg.a==='skl')actSkill(null,p);else if(msg.a==='mov')actMove(null,p);else if(msg.a==='itm')actItem(null,p);break;}
  case'snap':{if(NET.host||!B||scene!=='battle')return;const m=B.m;
   m.hp=msg.m.hp;m.maxhp=msg.m.maxhp;m.state=msg.m.state;m.st=msg.m.st;m.teleDur=msg.m.tele;m.second=msg.m.second;m.dash=msg.m.dash;m.dashTo=msg.m.dashTo;
   if(msg.m.atk&&ATTACKS[msg.m.atk])m.atk=ATTACKS[msg.m.atk];
   B.clock=msg.clock;
   for(const id in msg.ps){const q=B.ps[id];if(!q)continue;const r=msg.ps[id];
    q.hp=r.hp;q.row=r.row;q.down=r.down;q.downT=r.downT;q.guard=r.guard;q.regen=r.regen;q.buff=r.buff;q.mikiri=r.mikiri;q.hurt=r.hurt;q.lunge=r.lunge;
    if(q!==B.p){q.cd.atk=r.cd.atk;q.cd.skill=r.cd.skill;q.cd.move=r.cd.move;q.cd.item=r.cd.item;}
    else{['atk','skill','move','item'].forEach(k=>{if(r.cd[k]>q.cd[k])q.cd[k]=r.cd[k];});}}
   break;}
  case'end':{if(NET.host||!B||B.over)return;B.over=msg.win?'win':'lose';B.overT=0;B.clock=msg.clock||B.clock;
   toast(msg.win?'討伐成功！':'全員力尽きた…');sfx(msg.win?'win':'lose');break;}
 }}

function renderBattleUI(){setUI(`<div class="hud"><div id="pn"></div><div class="hpbar"><i id="php"></i></div><div id="prow"></div><div id="party"></div></div><div class="flash" id="flash"></div><div class="rowlab" id="rlF"></div><div class="rowlab" id="rlB"></div><div class="hud r"><div id="mn"></div><div class="mhp"><i id="mhp"></i></div></div><button class="small quit" onclick="quitQuest()">村へ戻る</button><div class="tele" id="tele"></div><div class="bctl"><button class="a" id="bAtk" onpointerdown="actAttack(event)">攻撃<em></em></button><button class="s" id="bSkl" onpointerdown="actSkill(event)"><span id="skn"></span><em></em></button><button class="m" id="bMov" onpointerdown="actMove(event)"><span id="mvn"></span><em></em></button><button class="i" id="bItm" onpointerdown="actItem(event)">回復薬<small id="itn"></small><em></em></button></div><div class="toast" id="toast"></div>`);}

  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(px+9,py+22,8,3,0,0,Math.PI*2);ctx.fill();
  if(q.down){ctx.globalAlpha=0.45;drawSpr(playerSprite(q.job,0),px,py+4,false,1);ctx.globalAlpha=1;
   ctx.strokeStyle='#ff7070';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(px+4,py+2);ctx.lineTo(px+14,py+12);ctx.moveTo(px+14,py+2);ctx.lineTo(px+4,py+12);ctx.stroke();
   drawNum(String(Math.ceil(q.downT)),px+9,py-8,'#ff9a8a');return;}
  if(q===B.p){ctx.strokeStyle='rgba(240,201,106,.85)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(px+9,py+22,9,4,0,0,Math.PI*2);ctx.stroke();}
  drawSpr(playerSprite(q.job,q.lunge>0?1:0),px,py,false,1);drawWeapon(q.d.wtype,px+17,py+13);
  if(q.hurt>0){ctx.globalAlpha=0.75;drawSpr(playerFlash(q.lunge>0?1:0),px,py,false,1);ctx.globalAlpha=1;}
  if(q.guard>0){ctx.strokeStyle='rgba(159,182,255,.85)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(px+9,py+14,13,0,Math.PI*2);ctx.stroke();}
  if(q.buff>0){ctx.strokeStyle='rgba(255,211,90,.7)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(px+9,py+14,11,0,Math.PI*2);ctx.stroke();}
  if(q.mikiri){ctx.fillStyle='#ffd35a';for(let i=0;i<3;i++)ctx.fillRect(px+5+i*4,py-5-(i===1?2:0),2,2);}
  if(q.regen>0){ctx.fillStyle='rgba(255,242,160,.75)';for(let i=0;i<3;i++){const ph=(B.t*0.8+i/3)%1;ctx.fillRect(Math.round(px+3+i*6),Math.round(py+20-ph*22),2,2);}}
  B.fx.forEach(f=>{if(f.follow&&q===B.p){f.x=px+9;f.y=py+14;}else if(f.who===q.id){f.x=px+9;f.y=py+14;}});});
 // 弾・エフェクト・数字
 B.shots.forEach(s=>{const k=s.t/s.dur,x=s.x0+(s.x1-s.x0)*k,y=s.y0+(s.y1-s.y0)*k-Math.sin(k*Math.PI)*6;ctx.fillStyle=s.col;ctx.fillRect(Math.round(x-s.r),Math.round(y-s.r),s.r*2,s.r*2);});
 B.fx.forEach(f=>{const k=f.tt/f.dur;ctx.globalAlpha=1-k;ctx.lineWidth=2;
  if(f.t==='slash'){ctx.strokeStyle=f.col;ctx.beginPath();ctx.arc(f.x,f.y,5+k*5,f.a-1.1,f.a+1.1);ctx.stroke();}
  else if(f.t==='ring'){ctx.strokeStyle=f.col;ctx.beginPath();ctx.arc(f.x,f.y,f.follow?f.r:f.r*(0.3+k*0.7),0,Math.PI*2);ctx.stroke();}
  else if(f.t==='burst'){ctx.fillStyle=f.col;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(0.4+k*0.6),0,Math.PI*2);ctx.fill();}
  else if(f.t==='dust'){ctx.fillStyle=f.col;for(let i=0;i<4;i++)ctx.fillRect(Math.round(f.x-8+i*5),Math.round(f.y-k*6),2,2);}
  ctx.globalAlpha=1;});
 B.nums.forEach(n=>{ctx.globalAlpha=1-n.t/0.9;drawNum(n.txt,n.x,n.y-n.t*16,n.col);});ctx.globalAlpha=1;
 if(B.over){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,LW,LH);}
 updateBattleHUD();}
function updateBattleHUD(){const p=B.p,m=B.m,J=JOBS[p.job];const pn=$('#pn');if(!pn)return;pn.textContent=S.p.name+' Lv'+S.p.lv+'　'+J.name;$('#php').style.width=Math.max(0,p.hp/p.maxhp*100)+'%';$('#prow').innerHTML=(B.p.row==='front'?'前衛':'後衛')+(p.guard>0?' <span class="tag">構え</span>':'')+(p.mikiri?' <span class="tag" style="color:#ffd35a">見切り</span>':'')+(p.regen>0?' <span class="tag">再生</span>':'')+(p.buff>0?' <span class="tag">攻撃UP</span>':'')+'<br><small>'+fmtTime(B.clock*1000)+'</small>';$('#mn').textContent=m.def.name;$('#mhp').style.width=Math.max(0,m.hp/m.maxhp*100)+'%';
 const RN=r=>r==='front'?'前衛':'後衛';
 const t=$('#tele');if(m.state==='tele'){const a=m.atk;const tgt=a.seq?a.seq.map(RN).join(' → '):a.rows.map(RN).join('と');t.innerHTML=`⚠ ${a.name} → ${tgt}<div class="tb"><i style="width:${Math.max(0,100-m.st/m.teleDur*100)}%"></i></div>`;}else if(m.state==='act2'&&!m.second){t.innerHTML=`⚠ 次は${RN(m.atk.seq[1])}！<div class="tb"><i style="width:${Math.max(0,100-m.st/0.7*100)}%"></i></div>`;}else t.textContent='';
 const cdv=(id,k)=>{const b=$(id);b.querySelector('em').style.height=(p.cd[k]/p.cdMax[k]*100)+'%';};cdv('#bAtk','atk');cdv('#bSkl','skill');cdv('#bMov','move');cdv('#bItm','item');
 $('#skn').textContent=J.skill;$('#mvn').textContent=B.p.row==='front'?'後ろへ':'前へ';$('#itn').textContent='×'+S.p.items.potion;
 const party=$('#party');if(party){const others=psList().filter(q=>q!==B.p);
  party.innerHTML=others.map(q=>`<div class="pm"><span>${esc(q.name)}<small> ${JOBS[q.job].name}・${q.row==='front'?'前':'後'}</small></span><div class="pb"><i style="width:${Math.max(0,q.hp/q.maxhp*100)}%;background:${q.down?'#7a3a3a':'#57d05a'}"></i></div></div>`).join('');}
 const teleRows=m.state==='tele'?(m.atk.seq?[m.atk.seq[0]]:m.atk.rows):(m.state==='act2'&&!m.second?[m.atk.seq[1]]:[]);
 [['#rlF','front','前衛'],['#rlB','back','後衛']].forEach(([sel,r,label])=>{const el=$(sel);if(!el)return;el.textContent=label;el.style.left=((posX(r)+8)*SCALE)+'px';el.style.top=((GY()+12)*SCALE)+'px';el.className='rowlab'+(teleRows.includes(r)?' danger':(B.p.row===r?' here':''));});}
let last=0;
let errShown=false;
function showErr(msg){if(errShown)return;errShown=true;const d=document.createElement('div');d.style.cssText='position:fixed;left:6px;right:6px;bottom:6px;z-index:99;background:#5c1a14;color:#ffe9e0;border:2px solid #ffb0a0;padding:8px;font-size:12px;line-height:1.4;white-space:pre-wrap';
 d.textContent='不具合が出ました。この文をダムさんに伝えてください:\n'+msg;d.onclick=()=>d.remove();document.body.appendChild(d);}
addEventListener('error',e=>showErr((e.message||'error')+' @'+(e.lineno||'?')));
addEventListener('unhandledrejection',e=>showErr('promise: '+(e.reason&&e.reason.message||e.reason)));
function loop(now){const dt=Math.min(0.05,(now-last)/1000)||0;last=now;try{
 if(scene==='battle'&&B){updateBattle(dt);if(B)drawBattle();else drawWorld(dt);}
 else if(scene==='world'){updateWorld(dt);drawWorld(dt);}
 else{vt+=dt;ctx.fillStyle='#24402a';ctx.fillRect(0,0,LW,LH);if(S){ctx.save();const cam=mapCam();ctx.translate(-Math.round(cam.cx),-Math.round(cam.cy));ctx.drawImage(getMap(W.map),0,0);ctx.restore();}}
 }catch(err){showErr(err&&err.message?err.message:String(err));}
 requestAnimationFrame(loop);}
showTitle();requestAnimationFrame(t=>{last=t;loop(t);});
</script>
